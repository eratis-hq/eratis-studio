    q('#dock-btn-zen').addEventListener('click', () => {
      this._closeMobileMenu();
      this.toggleUiHidden();
    });

    q('#dock-btn-studio').addEventListener('click', () => {
      this._closeMobileMenu();
      this._hidePopoverImmediate();
      this.onToggleStudio();
    });

    q('#dock-rec-badge').addEventListener('click', () => {
      this.onStopRecording();
    });

    const hoverTargets = this.el.querySelectorAll('[data-hover-key]');
    hoverTargets.forEach((target) => {
      target.addEventListener('pointerenter', () => {
        this._cancelHideTimer();
        const key = target.getAttribute('data-hover-key');
        this._showPopover(key, target);
      });

      target.addEventListener('focus', () => {
        this._cancelHideTimer();
        const key = target.getAttribute('data-hover-key');
        this._showPopover(key, target);
      });

      target.addEventListener('pointerdown', (e) => {
        if (e.pointerType === 'touch') {
          this._cancelHideTimer();
          const key = target.getAttribute('data-hover-key');
          this._showPopover(key, target);
        }
      });
    });

    this.popoverEl.addEventListener('pointerenter', () => {
      this._cancelHideTimer();
    });

    this.popoverEl.addEventListener('pointerleave', () => {
      this._scheduleHidePopover();
    });

    this.el.addEventListener('pointerleave', () => {
      this._scheduleHidePopover();
    });

    const btnMore = q('#dock-btn-more');
    if (btnMore) {
      btnMore.addEventListener('click', (e) => {
        e.stopPropagation();
        this._hidePopoverImmediate();
        this.mobileMenuOpen = !this.mobileMenuOpen;
        this.el.classList.toggle('mobile-menu-open', this.mobileMenuOpen);
        btnMore.classList.toggle('active', this.mobileMenuOpen);
      });
    }

    const onDocPointerDown = (e) => {
      if (this.el && !this.el.contains(e.target)) {
        this._closeMobileMenu();
        this._hidePopoverImmediate();
      }
    };
    const onResize = () => {
      if (this._activeKey && this._activeTargetEl && this.popoverEl.classList.contains('visible')) {
        this._positionPopover(this._activeTargetEl);
      }
    };

    window.addEventListener('pointerdown', onDocPointerDown);
    window.addEventListener('resize', onResize);
    this._cleanups.push(() => {
      window.removeEventListener('pointerdown', onDocPointerDown);
      window.removeEventListener('resize', onResize);
    });

    this._cleanups.push(this.store.subscribe(() => this.sync()));
    this._cleanups.push(this.audioEngine.subscribe(() => this.sync()));
  }

  _cancelHideTimer() {
    if (this._hideTimer) {
      clearTimeout(this._hideTimer);
      this._hideTimer = null;
    }
  }

  _scheduleHidePopover() {
    this._cancelHideTimer();
    this._hideTimer = setTimeout(() => {
      this._hidePopoverImmediate();
    }, 240);
  }

  _hidePopoverImmediate() {
    this._cancelHideTimer();
    if (!this.popoverEl) return;
    this.popoverEl.classList.remove('visible');
    this.popoverEl.setAttribute('aria-hidden', 'true');
  }

  _showPopover(key, targetEl) {
    const cfg = POPOVER_CONFIG[key];
    if (!cfg || !this.popoverEl || !targetEl) return;

    this._activeKey = key;
    this._activeTargetEl = targetEl;

    const titleEl = this.popoverEl.querySelector('#popover-title');
    const kbdEl = this.popoverEl.querySelector('#popover-kbd');

    titleEl.textContent = cfg.title;
    kbdEl.textContent = cfg.shortcut;

    this._renderPopoverActions(key);

    this.popoverEl.classList.add('visible');
    this.popoverEl.setAttribute('aria-hidden', 'false');
    this._positionPopover(targetEl);
  }

  _positionPopover(targetEl) {
    if (!this.popoverEl || !this.el || !targetEl) return;
    const dockRect = this.el.getBoundingClientRect();
    const btnRect = targetEl.getBoundingClientRect();
    const popWidth = this.popoverEl.offsetWidth || 300;
    const vw = window.innerWidth;
    const margin = 14;

    const btnCenterViewportX = btnRect.left + btnRect.width * 0.5;
    const minCenterViewportX = margin + popWidth * 0.5;
    const maxCenterViewportX = vw - margin - popWidth * 0.5;
    const clampedCenterViewportX = Math.max(
      minCenterViewportX,
      Math.min(maxCenterViewportX, btnCenterViewportX)
    );

    const localLeft = clampedCenterViewportX - dockRect.left;
    const arrowOffsetPx = Math.max(
      18,
      Math.min(popWidth - 18, btnCenterViewportX - (clampedCenterViewportX - popWidth * 0.5))
    );

    this.popoverEl.style.left = `${localLeft.toFixed(1)}px`;
    this.popoverEl.style.setProperty('--popover-arrow-x', `${arrowOffsetPx.toFixed(1)}px`);
  }

  _renderPopoverActions(key) {
    const host = this.popoverEl ? this.popoverEl.querySelector('#popover-actions') : null;
    if (!host) return;
    const state = this.store.getState();

    if (key === 'brand') {
      host.innerHTML = `
        <a href="${APP_INFO.githubUrl}" target="_blank" rel="noopener noreferrer" class="popover-option-btn active">GitHub @eratis-hq ↗</a>
        <button type="button" class="popover-option-btn" data-pop-cmd="replay-intro">Replay Signature Intro</button>
      `;
    } else if (key === 'orbit') {
      const speeds = [
        { label: '0.35x Slow', val: 0.35 },
        { label: '0.55x Normal', val: 0.55 },
        { label: '1.10x Fast', val: 1.1 },
        { label: '1.80x Turbo', val: 1.8 }
      ];
      host.innerHTML = `
        <button type="button" class="popover-option-btn ${!state.camera.autoOrbit ? 'active' : ''}" data-pop-cmd="orbit-off">Off</button>
        ${speeds
          .map(
            (s) =>
              `<button type="button" class="popover-option-btn ${
                state.camera.autoOrbit && Math.abs(state.camera.orbitSpeed - s.val) < 0.05 ? 'active' : ''
              }" data-orbit-speed="${s.val}">${s.label}</button>`
          )
          .join('')}
      `;
    } else if (key === 'lock') {
      host.innerHTML = `
        <button type="button" class="popover-option-btn ${state.camera.staticLock ? 'active' : ''}" data-pop-cmd="lock-on">Lock Pose</button>
        <button type="button" class="popover-option-btn ${!state.camera.staticLock ? 'active' : ''}" data-pop-cmd="lock-off">Free Sway</button>
        <button type="button" class="popover-option-btn" data-pop-cmd="snap-center">Center Angle (0, 0)</button>
      `;
    } else if (key === 'warp') {
      const powers = [
        { label: '1.0x Cruise', val: 1.0 },
        { label: '1.6x Hyper', val: 1.6 },
        { label: '2.4x Max', val: 2.4 }
      ];
      host.innerHTML = `
        <button type="button" class="popover-option-btn ${!state.effects.warpActive ? 'active' : ''}" data-pop-cmd="warp-off">Off</button>
        ${powers
          .map(
            (p) =>
              `<button type="button" class="popover-option-btn ${
                state.effects.warpActive && Math.abs(state.effects.warpIntensity - p.val) < 0.1 ? 'active' : ''
              }" data-warp-power="${p.val}">${p.label}</button>`
          )
          .join('')}
      `;
    } else if (key === 'audio') {
      const snap = this.audioEngine.getPlaybackSnapshot();
      const hasTracks = this.audioEngine.getPlaylist().length > 0;
      const muted = Boolean(state.audio.muted);
      host.innerHTML = `
        ${
          hasTracks
            ? `
          <button type="button" class="popover-option-btn" data-pop-cmd="audio-prev">⏮ Prev</button>
          <button type="button" class="popover-option-btn ${snap.isPlaying ? 'active' : ''}" data-pop-cmd="audio-toggle">
            ${snap.isPlaying ? '❚❚ Pause' : '▶ Play'}
          </button>
          <button type="button" class="popover-option-btn" data-pop-cmd="audio-next">⏭ Next</button>
          <button type="button" class="popover-option-btn ${muted ? 'active' : ''}" data-pop-cmd="audio-mute">
            ${muted ? 'Unmute' : 'Mute'}
          </button>`
            : ''
        }
        <button type="button" class="popover-option-btn accent" data-pop-cmd="audio-add">+ Load Audio (.MP3 / .WAV)</button>
      `;
    } else if (key === 'mat') {
      host.innerHTML = Object.values(MATERIAL_CATALOG)
        .map(
          (m) => `
          <button type="button" class="popover-option-btn ${state.identity.material === m.id ? 'active' : ''}" data-mat-pick="${m.id}">
            <span class="chip-swatch" style="background: ${m.swatch}"></span>
            <span>${m.label}</span>
          </button>`
        )
        .join('');
    } else if (key === 'eratis') {
      host.innerHTML = `
        <button type="button" class="popover-option-btn ${state.identity.mode === 'eratis' ? 'active' : ''}" data-pop-cmd="reset-eratis">3D ERATIS Emblem</button>
        <button type="button" class="popover-option-btn ${state.identity.mode === 'text' ? 'active' : ''}" data-pop-cmd="mode-text">3D Custom Text</button>
        <button type="button" class="popover-option-btn ${state.identity.mode === 'image' ? 'active' : ''}" data-pop-cmd="mode-image">Image Layer</button>
      `;
    } else if (key === 'export') {
      host.innerHTML = `
        <button type="button" class="popover-option-btn active" data-quick-export="wallpaper-4k">4K UHD (3840×2160)</button>
        <button type="button" class="popover-option-btn" data-quick-export="wallpaper-16-9">16:9 Full HD</button>
        <button type="button" class="popover-option-btn" data-quick-export="wallpaper-21-9">21:9 Ultrawide</button>
        <button type="button" class="popover-option-btn" data-quick-export="wallpaper-9-16">9:16 Mobile</button>
        <button type="button" class="popover-option-btn" data-quick-export="profile-1-1">1:1 Square</button>
        <button type="button" class="popover-option-btn" data-quick-export="png-transparent">Alpha PNG</button>
      `;
    } else if (key === 'reset') {
      host.innerHTML = `
        <button type="button" class="popover-option-btn" data-pop-cmd="snap-center">Reset Camera Angle</button>
        <button type="button" class="popover-option-btn" data-pop-cmd="reset-eratis">Reset to ERATIS Logo</button>
        <button type="button" class="popover-option-btn active" data-pop-cmd="factory-reset-all">Factory Reset All</button>
      `;
    } else if (key === 'zen') {
      host.innerHTML = `
        <button type="button" class="popover-option-btn active" data-pop-cmd="enter-zen">Hide All UI Panels [H]</button>
      `;
    } else if (key === 'studio') {
      host.innerHTML = `
        <button type="button" class="popover-option-btn" data-studio-tab="identity">Identity</button>
        <button type="button" class="popover-option-btn" data-studio-tab="environment">Environment</button>
        <button type="button" class="popover-option-btn" data-studio-tab="audio">Audio</button>
        <button type="button" class="popover-option-btn" data-studio-tab="camera">Camera</button>
        <button type="button" class="popover-option-btn" data-studio-tab="effects">Effects</button>
      `;
    } else if (key === 'rec') {
      host.innerHTML = `
        <button type="button" class="popover-option-btn active" data-pop-cmd="stop-rec">Stop &amp; Save WebM Video</button>
      `;
    }

    this._bindPopoverActionClicks(host);
  }

  _bindPopoverActionClicks(host) {
    host.querySelectorAll('[data-orbit-speed]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const speed = Number(btn.getAttribute('data-orbit-speed'));
        this.store.updateSection('camera', { autoOrbit: true, staticLock: false, orbitSpeed: speed });
        this._renderPopoverActions('orbit');
      });
    });

    host.querySelectorAll('[data-warp-power]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const power = Number(btn.getAttribute('data-warp-power'));
        this.store.updateSection('effects', { warpActive: true, warpIntensity: power });
        this._renderPopoverActions('warp');
      });
    });

    host.querySelectorAll('[data-mat-pick]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const matId = btn.getAttribute('data-mat-pick');
        this.store.updateSection('identity', { material: matId });
        this._renderPopoverActions('mat');
      });
    });

    host.querySelectorAll('[data-studio-tab]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const tab = btn.getAttribute('data-studio-tab');
        this._hidePopoverImmediate();
        this.onOpenStudioTab(tab);
      });
    });

    host.querySelectorAll('[data-quick-export]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const type = btn.getAttribute('data-quick-export');
        this.onQuickExport(type);
      });
    });

    host.querySelectorAll('[data-pop-cmd]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const cmd = btn.getAttribute('data-pop-cmd');
        if (cmd === 'replay-intro') {
          this._hidePopoverImmediate();
          if (this.signatureIntro) this.signatureIntro.play();
        } else if (cmd === 'reset-eratis') {
          this.store.resetIdentityToEratis();
          this.sceneEngine.resetViewOrientation();
          this._renderPopoverActions(this._activeKey);
        } else if (cmd === 'orbit-off') {
          this.store.updateSection('camera', { autoOrbit: false });
          this._renderPopoverActions('orbit');
        } else if (cmd === 'lock-on') {
          this.store.updateSection('camera', { staticLock: true, autoOrbit: false });
          this._renderPopoverActions('lock');
        } else if (cmd === 'lock-off') {
          this.store.updateSection('camera', { staticLock: false });
          this._renderPopoverActions('lock');
        } else if (cmd === 'snap-center') {
          this.sceneEngine.resetViewOrientation();
          this._renderPopoverActions(this._activeKey);
        } else if (cmd === 'warp-off') {
          this.store.updateSection('effects', { warpActive: false });
          this._renderPopoverActions('warp');
        } else if (cmd === 'audio-prev') {
          this.audioEngine.prevTrack();
        } else if (cmd === 'audio-toggle') {
          this.audioEngine.togglePlay();
        } else if (cmd === 'audio-next') {
          this.audioEngine.nextTrack(true);
        } else if (cmd === 'audio-mute') {
          const cur = this.store.getState().audio.muted;
          this.store.updateSection('audio', { muted: !cur });
          this._renderPopoverActions('audio');
        } else if (cmd === 'audio-add') {
          this.onTriggerAudioLoad();
        } else if (cmd === 'mode-text') {
          this.store.updateSection('identity', { mode: 'text' });
          this._hidePopoverImmediate();
          this.onOpenStudioTab('identity');
        } else if (cmd === 'mode-image') {
          this.onTriggerImageLoad();
        } else if (cmd === 'enter-zen') {
          this._hidePopoverImmediate();
          this.setUiHidden(true);
        } else if (cmd === 'factory-reset-all') {
          this._triggerFullFactoryReset();
          this._renderPopoverActions(this._activeKey);
        } else if (cmd === 'stop-rec') {
          this._hidePopoverImmediate();
          this.onStopRecording();
        }
      });
    });
  }

  _closeMobileMenu() {
    if (!this.mobileMenuOpen) return;
    this.mobileMenuOpen = false;
    if (this.el) {
      this.el.classList.remove('mobile-menu-open');
      const btnMore = this.el.querySelector('#dock-btn-more');
      if (btnMore) btnMore.classList.remove('active');
    }
  }

  toggleUiHidden() {
    this.setUiHidden(!this.uiHidden);
  }

  _triggerFullFactoryReset() {
    this.store.resetAll();
    if (this.sceneEngine) {
      this.sceneEngine.resetViewOrientation();
    }
    this.onNotify('All settings restored to factory ERATIS defaults.', 'success');
  }

  setUiHidden(hidden) {
    this.uiHidden = Boolean(hidden);
    document.body.classList.toggle('ui-zen-hidden', this.uiHidden);
    if (this.restorePill) {
      this.restorePill.classList.toggle('hidden', !this.uiHidden);
    }
    if (this.uiHidden) {
      this._closeMobileMenu();
      this._hidePopoverImmediate();
      this.onNotify('Cinema Zen Mode active — Press [H] anytime to restore UI.', 'info');
    }
  }

  setStudioOpen(isOpen) {
    this.studioOpen = Boolean(isOpen);
    this.sync();
  }

  sync() {
    if (!this.el) return;
    const state = this.store.getState();

    const btnOrbit = this.el.querySelector('#dock-btn-orbit');
    const btnLock = this.el.querySelector('#dock-btn-lock');
    const btnWarp = this.el.querySelector('#dock-btn-warp');
    const btnAudio = this.el.querySelector('#dock-btn-audio');
    const audioLbl = this.el.querySelector('#dock-audio-label');
    const matLbl = this.el.querySelector('#dock-mat-label');
    const btnReset = this.el.querySelector('#dock-btn-reset-eratis');
    const btnStudio = this.el.querySelector('#dock-btn-studio');

    btnOrbit.classList.toggle('active', Boolean(state.camera.autoOrbit && !state.camera.staticLock));
    btnLock.classList.toggle('active', Boolean(state.camera.staticLock));
    btnWarp.classList.toggle('active', Boolean(state.effects.warpActive));
    btnStudio.classList.toggle('active', this.studioOpen);

    const activeMat = MATERIAL_CATALOG[state.identity.material] || MATERIAL_CATALOG.liquidChrome;
    if (matLbl) {
      const shortNames = {
        liquidChrome: 'CHROME',
        silver: 'SILVER',
        gold24k: '24K GOLD',
        matteMetal: 'MATTE',
        frostedGlass: 'GLASS',
        obsidian: 'OBSIDIAN'
      };
      matLbl.textContent = shortNames[activeMat.id] || 'CHROME';
    }

    btnReset.classList.toggle('hidden', state.identity.mode === 'eratis');

    const hasTracks = this.audioEngine.getPlaylist().length > 0;
    const isPlaying = this.audioEngine.isPlaying;
    btnAudio.classList.toggle('active', isPlaying);
    btnAudio.classList.toggle('playing-eq', isPlaying);
    audioLbl.textContent = !hasTracks ? 'AUDIO' : isPlaying ? 'PAUSE' : 'PLAY';

    if (this._activeKey && this.popoverEl && this.popoverEl.classList.contains('visible')) {
      this._renderPopoverActions(this._activeKey);
    }
  }

  dispose() {
    this._cancelHideTimer();
    for (const fn of this._cleanups) {
      fn();
    }
    this._cleanups = [];
    if (this.el && this.el.parentNode) {
      this.el.parentNode.removeChild(this.el);
    }
    if (this.restorePill && this.restorePill.parentNode) {
      this.restorePill.parentNode.removeChild(this.restorePill);
    }
    this.el = null;
    this.restorePill = null;
  }
}

  open() {
    if (!this.el) return;
    this.isOpen = true;
    this.el.classList.remove('hidden');
    this.onOpenChange(true);
    this._startMeterLoop();
  }

  close() {
    if (!this.el) return;
    this.isOpen = false;
    this.el.classList.add('hidden');
    this.onOpenChange(false);
    this._stopMeterLoop();
  }

  toggle() {
    if (this.isOpen) this.close();
    else this.open();
  }

  switchTab(tabId) {
    this.activeTab = tabId;
    const tabs = this.el.querySelectorAll('.studio-tab');
    tabs.forEach((btn) => {
      btn.classList.toggle('active', btn.getAttribute('data-tab') === tabId);
    });
    const panes = this.el.querySelectorAll('.tab-pane');
    panes.forEach((pane) => {
      pane.classList.toggle('active', pane.getAttribute('data-pane') === tabId);
    });
  }

  _bindEvents() {
    const q = (sel) => this.el.querySelector(sel);

    q('#studio-btn-close').addEventListener('click', () => this.close());
    q('#studio-btn-export').addEventListener('click', () => this.onOpenExport());
    q('#studio-btn-reset-all').addEventListener('click', () => {
      this.store.resetAll();
      this.sceneEngine.resetViewOrientation();
      this.presetManager.persistActiveState();
      this.onNotify('All settings restored to factory ERATIS defaults.', 'success');
    });

    this.el.querySelectorAll('.studio-tab').forEach((btn) => {
      btn.addEventListener('click', () => this.switchTab(btn.getAttribute('data-tab')));
    });

    const presetSelect = q('#preset-select');
    const saveDrawer = q('#preset-save-drawer');
    const nameInput = q('#preset-name-input');

    presetSelect.addEventListener('change', () => {
      const preset = this.presetManager.applyPreset(presetSelect.value);
      if (preset) {
        this.onNotify(`Applied preset: ${preset.name}`, 'info');
      }
    });

    q('#btn-preset-save').addEventListener('click', () => {
      saveDrawer.classList.toggle('hidden');
      if (!saveDrawer.classList.contains('hidden')) {
        nameInput.value = '';
        nameInput.focus();
      }
    });

    q('#btn-preset-cancel-save').addEventListener('click', () => {
      saveDrawer.classList.add('hidden');
    });

    const confirmSavePreset = () => {
      try {
        const res = this.presetManager.saveCustomPreset(nameInput.value);
        saveDrawer.classList.add('hidden');
        this.onNotify(
          res.updated ? `Updated preset "${res.preset.name}".` : `Saved preset "${res.preset.name}".`,
          'success'
        );
      } catch (err) {
        this.onNotify(err.message, 'warning');
      }
    };

    q('#btn-preset-confirm-save').addEventListener('click', confirmSavePreset);
    nameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') confirmSavePreset();
    });

    q('#btn-preset-delete').addEventListener('click', () => {
      const currentId = presetSelect.value;
      const preset = this.presetManager.getPresetById(currentId);
      if (!preset || preset.builtin) {
        this.onNotify('Built-in ERATIS presets cannot be deleted.', 'warning');
        return;
      }
      this.presetManager.deleteCustomPreset(currentId);
      this.onNotify(`Deleted custom preset "${preset.name}".`, 'info');
    });

    q('#btn-preset-import').addEventListener('click', () => {
      const input = document.getElementById('preset-json-input');
      if (input) input.click();
    });

    q('#btn-preset-export').addEventListener('click', () => {
      const preset = this.presetManager.getPresetById(presetSelect.value);
      const { json } = this.presetManager.exportSceneJSON(preset ? preset.name : 'ERATIS Custom');
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'eratis-preset.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
      this.onNotify('Exported schema-validated preset JSON (local media excluded).', 'success');
    });

    this.el.querySelectorAll('.seg-btn[data-mode]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const mode = btn.getAttribute('data-mode');
        this.store.updateSection('identity', { mode });
        this.presetManager.persistActiveState();
      });
    });

    q('#btn-return-eratis').addEventListener('click', () => {
      this.store.resetIdentityToEratis();
      this.presetManager.persistActiveState();
      this.onNotify('Restored default 3D ERATIS emblem.', 'info');
    });

    this.el.querySelectorAll('.material-chip').forEach((chip) => {
      chip.addEventListener('click', () => {
        const material = chip.getAttribute('data-material-id');
        this.store.updateSection('identity', { material });
        this.presetManager.persistActiveState();
      });
    });

    const bindText = (sel, key, isNumeric = true) => {
      const el = q(sel);
      el.addEventListener('input', () => {
        const val = isNumeric ? Number(el.value) : el.value;
        this.store.updateSection('identity', { text: { [key]: val } });
        this.presetManager.persistActiveState();
      });
    };
    bindText('#ctrl-text-value', 'value', false);
    bindText('#ctrl-text-font', 'font', false);
    bindText('#ctrl-text-spacing', 'letterSpacing', true);
    bindText('#ctrl-text-slant', 'italicSlant', true);
    bindText('#ctrl-text-depth', 'depth', true);
    bindText('#ctrl-text-bevel-size', 'bevelSize', true);
    bindText('#ctrl-text-bevel-thick', 'bevelThickness', true);

    q('#btn-upload-custom-font').addEventListener('click', () => {
      const input = document.getElementById('custom-font-input');
      if (input) input.click();
    });

    q('#btn-delete-font').addEventListener('click', () => {
      const select = q('#ctrl-text-font');
      if (!select || !select.value) return;
      try {
        const res = this.sceneEngine.deleteFont(select.value);
        if (res) {
          this.refreshFontOptions();
          this.syncFromStore();
          this.onNotify(`Deleted font: ${res.removedLabel}`, 'info');
        }
      } catch (err) {
        this.onNotify(err.message, 'warning');
      }
    });

    q('#btn-restore-fonts').addEventListener('click', () => {
      this.sceneEngine.restoreDefaultFonts();
      this.refreshFontOptions();
      this.onNotify('Restored all 16 built-in 3D fonts.', 'success');
    });

    q('#btn-upload-image').addEventListener('click', () => {
      const input = document.getElementById('image-input');
      if (input) input.click();
    });
    q('#btn-clear-image').addEventListener('click', () => {
      this.sceneEngine.clearCustomImage();
      this.onNotify('Cleared custom image layer.', 'info');
    });
    q('#ctrl-img-opacity').addEventListener('input', (e) => {
      this.store.updateSection('identity', { image: { opacity: Number(e.target.value) } });
    });
    q('#ctrl-img-scale').addEventListener('input', (e) => {
      this.store.updateSection('identity', { image: { scale: Number(e.target.value) } });
    });

    q('#ctrl-show-orbits').addEventListener('change', (e) => {
      this.store.updateSection('identity', { showOrbits: e.target.checked });
      this.presetManager.persistActiveState();
    });

    const bindIdentityNum = (sel, key) => {
      const el = q(sel);
      el.addEventListener('input', () => {
        this.store.updateSection('identity', { [key]: Number(el.value) });
        this.presetManager.persistActiveState();
      });
    };
    bindIdentityNum('#ctrl-id-scale', 'scale');
    bindIdentityNum('#ctrl-id-posx', 'positionX');
    bindIdentityNum('#ctrl-id-posy', 'positionY');
    bindIdentityNum('#ctrl-id-rotx', 'rotationX');
    bindIdentityNum('#ctrl-id-roty', 'rotationY');
    bindIdentityNum('#ctrl-id-rotz', 'rotationZ');

    q('#btn-reset-transform').addEventListener('click', () => {
      this.store.updateSection('identity', {
        positionX: 0,
        positionY: 0,
        scale: 1.0,
        rotationX: 0,
        rotationY: 0,
        rotationZ: 0,
        showOrbits: true
      });
      this.presetManager.persistActiveState();
    });

    q('#ctrl-env-bg').addEventListener('input', (e) => {
      this.store.updateSection('environment', { backgroundColor: e.target.value });
      this.presetManager.persistActiveState();
    });
    q('#btn-env-obsidian').addEventListener('click', () => {
      this.store.updateSection('environment', { backgroundColor: '#000000' });
      this.presetManager.persistActiveState();
    });

    const bindEnvNum = (sel, key) => {
      const el = q(sel);
      el.addEventListener('input', () => {
        this.store.updateSection('environment', { [key]: Number(el.value) });
        this.presetManager.persistActiveState();
      });
    };
    bindEnvNum('#ctrl-env-exposure', 'exposure');
    bindEnvNum('#ctrl-env-reflection', 'reflectionIntensity');
    bindEnvNum('#ctrl-env-key', 'keyLightIntensity');

    bindEnvNum('#ctrl-env-cursor', 'cursorLightIntensity');
    bindEnvNum('#ctrl-env-fog', 'fogDensity');
    bindEnvNum('#ctrl-env-star-count', 'starCount');
    bindEnvNum('#ctrl-env-star-speed', 'starSpeed');
    bindEnvNum('#ctrl-env-star-size', 'starSize');
    bindEnvNum('#ctrl-env-star-bright', 'starBrightness');

    q('#ctrl-env-stars-enabled').addEventListener('change', (e) => {
      this.store.updateSection('environment', { starfieldEnabled: e.target.checked });
      this.presetManager.persistActiveState();
    });

    q('#btn-audio-add-files').addEventListener('click', () => {

    q('#btn-audio-play').addEventListener('click', () => {

        if (input) input.click();

        this.audioEngine.togglePlay();
      }

    q('#btn-audio-prev').addEventListener('click', () => this.audioEngine.prevTrack());
    q('#btn-audio-next').addEventListener('click', () => this.audioEngine.nextTrack(true));

    q('#btn-audio-shuffle').addEventListener('click', () => {
      const cur = this.store.getState().audio.shuffle;
      this.store.updateSection('audio', { shuffle: !cur });
    });

    q('#btn-audio-repeat').addEventListener('click', () => {
      const cur = this.store.getState().audio.repeat;
      const next = REPEAT_MODES[(REPEAT_MODES.indexOf(cur) + 1) % REPEAT_MODES.length];
      this.store.updateSection('audio', { repeat: next });
    });

    q('#btn-audio-mute').addEventListener('click', () => {
      const cur = this.store.getState().audio.muted;
      this.store.updateSection('audio', { muted: !cur });
    });

    q('#ctrl-audio-volume').addEventListener('input', (e) => {
      this.store.updateSection('audio', { volume: Number(e.target.value), muted: false });
    });

    const scrubEl = q('#ctrl-audio-scrub');
    scrubEl.addEventListener('pointerdown', () => {
      this._isScrubbing = true;
    });
    scrubEl.addEventListener('input', () => {
      this.audioEngine.seekByProgress(Number(scrubEl.value) / 1000);
    });
    scrubEl.addEventListener('change', () => {
      this._isScrubbing = false;
      this.audioEngine.seekByProgress(Number(scrubEl.value) / 1000);
    });

    q('#btn-audio-clear').addEventListener('click', () => {
      this.audioEngine.clearPlaylist();
    });

    q('#ctrl-audio-reactive').addEventListener('change', (e) => {
      this.store.updateSection('audio', { reactive: e.target.checked });
    });
    q('#ctrl-audio-bass').addEventListener('input', (e) => {
      this.store.updateSection('audio', { bassSensitivity: Number(e.target.value) });
    });
    q('#ctrl-audio-midtreble').addEventListener('input', (e) => {
      this.store.updateSection('audio', { midTrebleSensitivity: Number(e.target.value) });
    });

    q('#btn-camera-reset').addEventListener('click', () => {
      this.sceneEngine.resetViewOrientation();
      this.store.resetCamera();
    });
    q('#ctrl-cam-dist').addEventListener('input', (e) => {
      this.store.updateSection('camera', { distance: Number(e.target.value) });
    });
    q('#ctrl-cam-fov').addEventListener('input', (e) => {
      this.store.updateSection('camera', { fov: Number(e.target.value) });
    });
    q('#ctrl-cam-parallax').addEventListener('input', (e) => {
      this.store.updateSection('camera', { parallaxStrength: Number(e.target.value) });
    });
    q('#ctrl-cam-lock').addEventListener('change', (e) => {
      const locked = e.target.checked;
      this.store.updateSection('camera', {
        staticLock: locked,
        autoOrbit: locked ? false : this.store.getState().camera.autoOrbit
      });
    });
    q('#ctrl-cam-orbit').addEventListener('change', (e) => {
      const orbit = e.target.checked;
      this.store.updateSection('camera', {
        autoOrbit: orbit,
        staticLock: orbit ? false : this.store.getState().camera.staticLock
      });
    });
    q('#ctrl-cam-orbit-speed').addEventListener('input', (e) => {
      this.store.updateSection('camera', { orbitSpeed: Number(e.target.value) });
    });
    q('#ctrl-cam-sway').addEventListener('change', (e) => {
      this.store.updateSection('camera', { idleSway: e.target.checked });
    });

    q('#ctrl-fx-warp').addEventListener('change', (e) => {
      this.store.updateSection('effects', { warpActive: e.target.checked });
    });
    q('#ctrl-fx-warp-int').addEventListener('input', (e) => {
      this.store.updateSection('effects', { warpIntensity: Number(e.target.value) });
    });
    q('#ctrl-fx-flares').addEventListener('change', (e) => {
      this.store.updateSection('effects', { lensFlares: e.target.checked });
    });
    q('#ctrl-fx-flare-int').addEventListener('input', (e) => {
      this.store.updateSection('effects', { flareIntensity: Number(e.target.value) });
    });
    q('#ctrl-fx-vignette').addEventListener('input', (e) => {
      this.store.updateSection('effects', { vignetteStrength: Number(e.target.value) });
    });

    q('#btn-replay-intro').addEventListener('click', () => {
      this.signatureIntro.play();
    });
    q('#btn-upload-signature').addEventListener('click', () => {
      const input = document.getElementById('signature-svg-input');
      if (input) input.click();
    });
    q('#btn-reset-signature').addEventListener('click', () => {
      this.signatureIntro.resetDefaultSignature();
      this._syncSignatureStatus();
    });

    this._cleanups.push(this.store.subscribe(() => this.syncFromStore()));
    this._cleanups.push(this.presetManager.subscribe(() => this.syncPresets()));
    if (this.sceneEngine && typeof this.sceneEngine.onTextBuildReport === 'function') {
      this._cleanups.push(
        this.sceneEngine.onTextBuildReport((report) => this._syncTextFontStatus(report))
      );
    }
    this._cleanups.push(
      this.audioEngine.subscribe((type) => {
        if (type === 'playlistchange' || type === 'trackchange') {
          this.syncPlaylist();
        }
        this.syncAudioTransport();
      })
    );
  }

  syncAll() {
    this.refreshFontOptions();
    this.syncPresets();
    this.syncFromStore();
    this.syncPlaylist();
    this.syncAudioTransport();
    this._syncSignatureStatus();
  }

  refreshFontOptions() {
    const select = this.el ? this.el.querySelector('#ctrl-text-font') : null;
    if (!select) return;
    const fonts = this.sceneEngine ? this.sceneEngine.getAvailableFonts() : FONT_OPTIONS;
    const currentVal = this.store.getState().identity.text.font;
    select.innerHTML = fonts
      .map((f) => `<option value="${f.id}" ${f.id === currentVal ? 'selected' : ''}>${f.label}</option>`)
      .join('');

    const restoreBtn = this.el.querySelector('#btn-restore-fonts');
    if (restoreBtn && this.sceneEngine && this.sceneEngine.textBuilder) {
      restoreBtn.classList.toggle('hidden', !this.sceneEngine.textBuilder.hasDeletedBuiltins());
    }

    const listEl = this.el.querySelector('#custom-fonts-list');
    if (listEl && this.sceneEngine && this.sceneEngine.textBuilder) {
      const customList = this.sceneEngine.textBuilder.getCustomFonts();
      if (customList.length === 0) {
        listEl.classList.add('hidden');
        listEl.innerHTML = '';
      } else {
        listEl.classList.remove('hidden');
        listEl.innerHTML = customList
          .map(
            (cf) => `
            <div class="custom-font-chip ${cf.id === currentVal ? 'active' : ''}">
              <button type="button" class="custom-font-pick" data-pick-font="${cf.id}">${cf.label}</button>
              <button type="button" class="custom-font-del" data-del-font="${cf.id}" title="Delete Font">✕</button>
            </div>`
          )
          .join('');

        listEl.querySelectorAll('[data-pick-font]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const id = btn.getAttribute('data-pick-font');
            this.store.updateSection('identity', { text: { font: id } });
            this.refreshFontOptions();
          });
        });

        listEl.querySelectorAll('[data-del-font]').forEach((btn) => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const id = btn.getAttribute('data-del-font');
            try {
              const res = this.sceneEngine.deleteFont(id);
              this.refreshFontOptions();
              this.syncFromStore();
              if (res) this.onNotify(`Deleted font: ${res.removedLabel}`, 'info');
            } catch (err) {
              this.onNotify(err.message, 'warning');
            }
          });
        });
      }
    }
  }

  _syncSignatureStatus() {
    const el = this.el.querySelector('#signature-file-status');
    if (!el) return;
    const customName = this.signatureIntro.getCustomSvgName();
    el.textContent = customName ? `Custom SVG: ${customName}` : 'Default ERATIS Signature SVG';
  }

  _syncTextFontStatus(report) {
    const el = this.el ? this.el.querySelector('#text-font-status') : null;
    if (!el) return;
    if (!report) {
      el.classList.add('hidden');
      el.textContent = '';
      return;
    }

    const parts = [];
    if (Array.isArray(report.missingChars) && report.missingChars.length > 0) {
      parts.push(`Unsupported: ${report.missingChars.join(' ')}`);
    }
    if (Array.isArray(report.fallbackChars) && report.fallbackChars.length > 0) {
      const fb = report.fallbackFontLabel || 'Unicode Fallback';
      parts.push(`Fallback (${fb}): ${report.fallbackChars.join(' ')}`);
    }

    if (parts.length > 0) {
      el.textContent = parts.join(' · ');
      el.title = el.textContent;
      el.classList.remove('hidden');
    } else {
      el.textContent = '';
      el.title = '';
      el.classList.add('hidden');
    }
  }

  syncPresets() {
    const select = this.el.querySelector('#preset-select');
    if (!select) return;
    const presets = this.presetManager.listPresets();
    const activeId = this.presetManager.activePresetId;

    select.innerHTML = presets
      .map(
        (p) =>
          `<option value="${p.id}" ${p.id === activeId ? 'selected' : ''}>${
            p.builtin ? '★ ' : '● '
          }${p.name}</option>`
      )
      .join('');
  }

  syncFromStore() {
    if (!this.el) return;
    const { identity, environment, audio, camera, effects } = this.store.getState();
    const q = (sel) => this.el.querySelector(sel);

    this.el.querySelectorAll('.seg-btn[data-mode]').forEach((btn) => {
      btn.classList.toggle('active', btn.getAttribute('data-mode') === identity.mode);
    });
    q('#identity-text-section').classList.toggle('hidden', identity.mode !== 'text');
    q('#identity-image-section').classList.toggle('hidden', identity.mode !== 'image');

    this.el.querySelectorAll('.material-chip').forEach((chip) => {
      chip.classList.toggle('active', chip.getAttribute('data-material-id') === identity.material);
    });

    const textInput = q('#ctrl-text-value');
    if (document.activeElement !== textInput) {
      textInput.value = identity.text.value;
    }
    q('#ctrl-text-font').value = identity.text.font;
    q('#ctrl-text-spacing').value = identity.text.letterSpacing;
    q('#out-text-spacing').textContent = identity.text.letterSpacing.toFixed(2);
    q('#ctrl-text-slant').value = identity.text.italicSlant;
    q('#out-text-slant').textContent = identity.text.italicSlant.toFixed(2);
    q('#ctrl-text-depth').value = identity.text.depth;
    q('#out-text-depth').textContent = identity.text.depth.toFixed(2);
    q('#ctrl-text-bevel-size').value = identity.text.bevelSize;
    q('#out-text-bevel-size').textContent = identity.text.bevelSize.toFixed(3);
    q('#ctrl-text-bevel-thick').value = identity.text.bevelThickness;
    q('#out-text-bevel-thick').textContent = identity.text.bevelThickness.toFixed(3);

    q('#image-file-status').textContent = identity.image.fileName
      ? `Loaded: ${identity.image.fileName}`
      : 'No custom image loaded';
    q('#ctrl-img-opacity').value = identity.image.opacity;
    q('#out-img-opacity').textContent = identity.image.opacity.toFixed(2);
    q('#ctrl-img-scale').value = identity.image.scale;
    q('#out-img-scale').textContent = identity.image.scale.toFixed(2);

    q('#ctrl-show-orbits').checked = Boolean(identity.showOrbits);
    q('#ctrl-id-scale').value = identity.scale;
    q('#out-id-scale').textContent = identity.scale.toFixed(2);
    q('#ctrl-id-posx').value = identity.positionX;
    q('#out-id-posx').textContent = identity.positionX.toFixed(2);
    q('#ctrl-id-posy').value = identity.positionY;
    q('#out-id-posy').textContent = identity.positionY.toFixed(2);
    q('#ctrl-id-rotx').value = identity.rotationX;
    q('#out-id-rotx').textContent = `${Math.round(identity.rotationX)}°`;
    q('#ctrl-id-roty').value = identity.rotationY;
    q('#out-id-roty').textContent = `${Math.round(identity.rotationY)}°`;
    q('#ctrl-id-rotz').value = identity.rotationZ;
    q('#out-id-rotz').textContent = `${Math.round(identity.rotationZ)}°`;

    q('#ctrl-env-bg').value = environment.backgroundColor;
    q('#ctrl-env-exposure').value = environment.exposure;
    q('#out-env-exposure').textContent = environment.exposure.toFixed(2);
    q('#ctrl-env-reflection').value = environment.reflectionIntensity;
    q('#out-env-reflection').textContent = environment.reflectionIntensity.toFixed(2);
    q('#ctrl-env-key').value = environment.keyLightIntensity;
    q('#out-env-key').textContent = environment.keyLightIntensity.toFixed(2);
    q('#ctrl-env-rim').value = environment.rimLightIntensity;
    q('#out-env-rim').textContent = environment.rimLightIntensity.toFixed(2);
    q('#ctrl-env-cursor').value = environment.cursorLightIntensity;
    q('#out-env-cursor').textContent = environment.cursorLightIntensity.toFixed(2);
    q('#ctrl-env-fog').value = environment.fogDensity;
    q('#out-env-fog').textContent = environment.fogDensity.toFixed(4);
    q('#ctrl-env-stars-enabled').checked = Boolean(environment.starfieldEnabled);
    q('#ctrl-env-star-count').value = environment.starCount;
    q('#out-env-star-count').textContent = String(environment.starCount);
    q('#ctrl-env-star-speed').value = environment.starSpeed;
    q('#out-env-star-speed').textContent = environment.starSpeed.toFixed(2);
    q('#ctrl-env-star-size').value = environment.starSize;
    q('#out-env-star-size').textContent = environment.starSize.toFixed(2);
    q('#ctrl-env-star-bright').value = environment.starBrightness;
    q('#out-env-star-bright').textContent = environment.starBrightness.toFixed(2);

    q('#ctrl-audio-reactive').checked = Boolean(audio.reactive);
    q('#ctrl-audio-bass').value = audio.bassSensitivity;
    q('#out-audio-bass').textContent = audio.bassSensitivity.toFixed(2);
    q('#ctrl-audio-midtreble').value = audio.midTrebleSensitivity;
    q('#out-audio-midtreble').textContent = audio.midTrebleSensitivity.toFixed(2);
    q('#ctrl-audio-volume').value = audio.volume;
    q('#btn-audio-mute').textContent = audio.muted ? 'Unmute' : 'Mute';
    q('#btn-audio-shuffle').classList.toggle('active', Boolean(audio.shuffle));
    q('#btn-audio-repeat').textContent = `REP: ${audio.repeat.toUpperCase()}`;
    q('#btn-audio-repeat').classList.toggle('active', audio.repeat !== 'off');

    q('#ctrl-cam-dist').value = camera.distance;
    q('#out-cam-dist').textContent = camera.distance.toFixed(1);
    q('#ctrl-cam-fov').value = camera.fov;
    q('#out-cam-fov').textContent = `${Math.round(camera.fov)}°`;
    q('#ctrl-cam-parallax').value = camera.parallaxStrength;
    q('#out-cam-parallax').textContent = camera.parallaxStrength.toFixed(2);
    q('#ctrl-cam-lock').checked = Boolean(camera.staticLock);
    q('#ctrl-cam-orbit').checked = Boolean(camera.autoOrbit);
    q('#ctrl-cam-orbit-speed').value = camera.orbitSpeed;
    q('#out-cam-orbit-speed').textContent = camera.orbitSpeed.toFixed(2);
    q('#ctrl-cam-sway').checked = Boolean(camera.idleSway);

    q('#out-fx-flare-int').textContent = effects.flareIntensity.toFixed(2);
    q('#ctrl-fx-vignette').value = effects.vignetteStrength;
    q('#out-fx-vignette').textContent = effects.vignetteStrength.toFixed(2);

  syncPlaylist() {
    const listEl = this.el.querySelector('#audio-playlist');
    const countEl = this.el.querySelector('#playlist-count');
    if (!listEl || !countEl) return;

    const playlist = this.audioEngine.getPlaylist();
    const currentIndex = this.audioEngine.getCurrentIndex();
    countEl.textContent = String(playlist.length);

    if (playlist.length === 0) {
      listEl.innerHTML = `<div class="playlist-empty">Drop .MP3 / .WAV / .OGG / .FLAC files anywhere or click "+ ADD TRACKS"</div>`;
      return;
    }

    listEl.innerHTML = playlist
      .map(
        (t, idx) => `
        <div class="playlist-item ${idx === currentIndex ? 'active' : ''}" data-track-idx="${idx}">
          <button type="button" class="playlist-select-btn" data-select-track="${idx}">
            <span class="playlist-idx">${String(idx + 1).padStart(2, '0')}</span>
            <span class="playlist-name">${t.name}</span>
            <span class="playlist-dur">${t.duration ? formatTime(t.duration) : ''}</span>
          </button>
          <button type="button" class="playlist-remove-btn" data-remove-track="${idx}" title="Remove Track">✕</button>
        </div>`
      )
      .join('');

    listEl.querySelectorAll('[data-select-track]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const idx = Number(btn.getAttribute('data-select-track'));
        this.audioEngine.selectTrack(idx, true);
      });
    });

    listEl.querySelectorAll('[data-remove-track]').forEach((btn) => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const idx = Number(btn.getAttribute('data-remove-track'));
        this.audioEngine.removeTrack(idx);
      });
    });
  }

  syncAudioTransport() {
    if (!this.el) return;
    const snap = this.audioEngine.getPlaybackSnapshot();
    const titleEl = this.el.querySelector('#audio-now-playing');
    const playBtn = this.el.querySelector('#btn-audio-play');
    const curEl = this.el.querySelector('#audio-time-current');
    const totEl = this.el.querySelector('#audio-time-total');
    const scrubEl = this.el.querySelector('#ctrl-audio-scrub');

    if (titleEl) {
      titleEl.textContent = snap.track
        ? `${snap.isPlaying ? '▶ ' : '❚❚ '}${snap.track.name}`
        : 'No track loaded — drop or add audio files';
    }
    if (playBtn) {
      playBtn.textContent = snap.isPlaying ? 'PAUSE' : 'PLAY';
    }
    if (curEl) curEl.textContent = formatTime(snap.currentTime);
    if (totEl) totEl.textContent = formatTime(snap.duration);

    if (scrubEl && !this._isScrubbing) {
      const ratio = snap.duration > 0 ? snap.currentTime / snap.duration : 0;
      scrubEl.value = String(Math.round(ratio * 1000));
    }
  }

  _startMeterLoop() {
    if (this._meterRaf !== null) return;
    const updateMeters = () => {
      if (!this.isOpen) {
        this._meterRaf = null;
        return;
      }
      this._meterRaf = requestAnimationFrame(updateMeters);
      const levels = this.audioEngine.levels;
      const bPct = Math.round(Math.min(1, levels.bass) * 100);
      const mPct = Math.round(Math.min(1, levels.mid) * 100);
      const tPct = Math.round(Math.min(1, levels.treble) * 100);

      const bFill = this.el.querySelector('#meter-fill-bass');
      const mFill = this.el.querySelector('#meter-fill-mid');
      const tFill = this.el.querySelector('#meter-fill-treble');
      const bVal = this.el.querySelector('#meter-val-bass');
      const mVal = this.el.querySelector('#meter-val-mid');
      const tVal = this.el.querySelector('#meter-val-treble');

      if (bFill) bFill.style.width = `${bPct}%`;
      if (mFill) mFill.style.width = `${mPct}%`;
      if (tFill) tFill.style.width = `${tPct}%`;
      if (bVal) bVal.textContent = `${bPct}%`;
      if (mVal) mVal.textContent = `${mPct}%`;
      if (tVal) tVal.textContent = `${tPct}%`;
    };
    this._meterRaf = requestAnimationFrame(updateMeters);
  }

  _stopMeterLoop() {
    if (this._meterRaf !== null) {
      cancelAnimationFrame(this._meterRaf);
      this._meterRaf = null;
    }
  }

  dispose() {
    this._stopMeterLoop();
    for (const fn of this._cleanups) {
      fn();
    }
    this._cleanups = [];
    if (this.el && this.el.parentNode) {
      this.el.parentNode.removeChild(this.el);
    }
    this.el = null;
  }
}

class EratisStudioApp {
  constructor() {
    this.store = new Store(DEFAULT_STATE);
    this.audioEngine = new AudioEngine(this.store);
    this.presetManager = new PresetManager(this.store);

    this.toastStack = document.getElementById('toast-stack');
    this.contextBanner = document.getElementById('context-lost-banner');

    this.presetManager.restoreActiveState();

    const stageEl = document.getElementById('canvas-stage');
    this.sceneEngine = new SceneEngine({
      container: stageEl,
      store: this.store,
      audioEngine: this.audioEngine,
      onNotify: (msg, level) => this.notify(msg, level),
      onContextChange: (lost) => this._handleContextLoss(lost)
    });

    this.signatureIntro = new SignatureIntro({
      onReveal: (immediate) => this.sceneEngine.triggerIntroReveal(immediate),
      onNotify: (msg, level) => this.notify(msg, level)
    });

    this.exportStudio = new ExportStudio({
      sceneEngine: this.sceneEngine,
      presetManager: this.presetManager,
      audioEngine: this.audioEngine,
      onNotify: (msg, level) => this.notify(msg, level)
    });

    this.dock = new ControlDock({
      store: this.store,
      sceneEngine: this.sceneEngine,
      audioEngine: this.audioEngine,
      signatureIntro: this.signatureIntro,
      onToggleStudio: () => this.studioPanel.toggle(),
      onOpenStudioTab: (tab) => {
        this.studioPanel.open();
        this.studioPanel.switchTab(tab);
      },
      onToggleExport: () => this.exportStudio.toggle(),
      onQuickExport: (type) => this.exportStudio.triggerExportAction(type),
      onTriggerAudioLoad: () => {
        const input = document.getElementById('audio-input');
        if (input) input.click();
      },
      onTriggerFontLoad: () => {
        const input = document.getElementById('custom-font-input');
        if (input) input.click();
      },
      onTriggerImageLoad: () => {
        const input = document.getElementById('image-input');
        if (input) input.click();
      },
      onStopRecording: () => this.exportStudio.stopRecording(),
      onNotify: (msg, level) => this.notify(msg, level)
    });

    this.studioPanel = new StudioPanel({
      store: this.store,
      sceneEngine: this.sceneEngine,
      audioEngine: this.audioEngine,
      presetManager: this.presetManager,
      signatureIntro: this.signatureIntro,
      onOpenExport: () => this.exportStudio.open(),
      onNotify: (msg, level) => this.notify(msg, level),
      onOpenChange: (isOpen) => this.dock.setStudioOpen(isOpen)
    });

    this._bindFileInputs();
    this._bindDragAndDrop();
    this._bindKeyboardShortcuts();
    this._bindLifecycleCleanup();

    this.signatureIntro.play();
  }

  notify(message, level = 'info') {
    if (!this.toastStack || !message) return;
    const item = document.createElement('div');
    item.className = `toast-item ${level}`;
    item.textContent = message;
    this.toastStack.appendChild(item);

    setTimeout(() => {
      if (item.parentNode) {
        item.parentNode.removeChild(item);
      }
    }, 3200);
  }

  _handleContextLoss(isLost) {
    if (!this.contextBanner) return;
    this.contextBanner.classList.toggle('hidden', !isLost);
    if (isLost) {
      this.notify('WebGL context lost — waiting for GPU recovery.', 'warning');
    } else {
      this.notify('WebGL context restored.', 'success');
    }
  }

  _bindFileInputs() {
    const audioInput = document.getElementById('audio-input');
    const imageInput = document.getElementById('image-input');
    const fontInput = document.getElementById('custom-font-input');
    const sigInput = document.getElementById('signature-svg-input');
    const presetInput = document.getElementById('preset-json-input');

    if (audioInput) {
      audioInput.addEventListener('change', (e) => {
        const files = e.target.files;
        if (files && files.length > 0) {
          const added = this.audioEngine.addFiles(files, { autoPlayFirst: true });
          if (added.length > 0) {
            this.notify(
              added.length === 1
                ? `Playing "${added[0].name}"`
                : `Added ${added.length} tracks to playlist`,
              'success'
            );
          }
        }
        audioInput.value = '';
      });
    }

    if (imageInput) {
      imageInput.addEventListener('change', async (e) => {
        const file = e.target.files && e.target.files[0];
        if (file) {
          try {
            const meta = await this.sceneEngine.loadCustomImage(file);
            this.notify(`Loaded image layer: ${meta.fileName}`, 'success');
          } catch (err) {
            this.notify(err.message, 'error');
          }
        }
        imageInput.value = '';
      });
    }

    if (fontInput) {
      fontInput.addEventListener('change', async (e) => {
        const files = Array.from(e.target.files || []);
        for (const file of files) {
          try {
            const entry = await this.sceneEngine.loadCustomFont(file);
            this.studioPanel.refreshFontOptions();
            this.studioPanel.syncFromStore();
            this.notify(`Added 3D font: ${entry.label}`, 'success');
          } catch (err) {
            this.notify(`Font error: ${err.message}`, 'error');
          }
        }
        fontInput.value = '';
      });
    }

    if (sigInput) {
      sigInput.addEventListener('change', async (e) => {
        const file = e.target.files && e.target.files[0];
        if (file) {
          try {
            await this.signatureIntro.loadCustomSvgFile(file);
            this.studioPanel.syncAll();
          } catch (err) {
            this.notify(err.message, 'error');
          }
        }
        sigInput.value = '';
      });
    }

    if (presetInput) {
      presetInput.addEventListener('change', async (e) => {
        const file = e.target.files && e.target.files[0];
        if (file) {
          await this._importPresetJsonFile(file);
        }
        presetInput.value = '';
      });
    }
  }

  async _importPresetJsonFile(file) {
    try {
      const text = await file.text();
      const res = this.presetManager.importSceneJSON(text, {
        saveAsCustom: true,
        applyImmediately: true
      });
      if (!res.ok) {
        this.notify(`Preset rejected: ${res.errors.join(' ')}`, 'error');
        return;
      }
      if (res.warnings.length > 0) {
        this.notify(res.warnings[0], 'warning');
      } else {
        this.notify(`Imported preset "${res.preset.name}".`, 'success');
      }
    } catch (err) {
      this.notify(`Failed to import preset JSON: ${err.message}`, 'error');
    }
  }

  _bindDragAndDrop() {
    const dropVeil = document.getElementById('drop-veil');
    let dragCounter = 0;

    window.addEventListener('dragenter', (e) => {
      e.preventDefault();
      dragCounter++;
      if (dropVeil) dropVeil.classList.add('active');
    });

    window.addEventListener('dragover', (e) => {
      e.preventDefault();
    });

    window.addEventListener('dragleave', () => {
      dragCounter--;
      if (dragCounter <= 0) {
        dragCounter = 0;
        if (dropVeil) dropVeil.classList.remove('active');
      }
    });

    window.addEventListener('drop', async (e) => {
      e.preventDefault();
      dragCounter = 0;
      if (dropVeil) dropVeil.classList.remove('active');

      const files = Array.from((e.dataTransfer && e.dataTransfer.files) || []);
      if (files.length === 0) return;

      const audioFiles = files.filter((f) => AudioEngine.isAudioFile(f));
      if (audioFiles.length > 0) {
        const added = this.audioEngine.addFiles(audioFiles, { autoPlayFirst: true });
        this.notify(`Loaded ${added.length} audio track(s).`, 'success');
      }

      const fontFile = files.find((f) => TextBuilder.isSupportedFontFile(f));
      if (fontFile) {
        try {
          const entry = await this.sceneEngine.loadCustomFont(fontFile);
          this.studioPanel.refreshFontOptions();
          this.studioPanel.syncFromStore();
          this.notify(`Loaded custom 3D font: ${entry.label}`, 'success');
        } catch (err) {
          this.notify(`Font error: ${err.message}`, 'error');
        }
      }

      const jsonFile = files.find(
        (f) => !TextBuilder.isSupportedFontFile(f) && (/\.json$/i.test(f.name || '') || f.type === 'application/json')
      );
      if (jsonFile) {
        await this._importPresetJsonFile(jsonFile);
      }

      const imageFile = files.find((f) => ImageLayer.isSupportedImageFile(f));
      if (imageFile) {
        try {
          const meta = await this.sceneEngine.loadCustomImage(imageFile);
          this.notify(`Loaded image layer: ${meta.fileName}`, 'success');
        } catch (err) {
          this.notify(err.message, 'error');
        }
      }
    });
  }

  _bindKeyboardShortcuts() {
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (this.signatureIntro && this.signatureIntro.isActive) {
          e.preventDefault();
          this.signatureIntro.skip();
          return;
        }
        if (this.dock && this.dock.uiHidden) {
          e.preventDefault();
          this.dock.setUiHidden(false);
          return;
        }
        if (this.exportStudio && this.exportStudio.isOpen) {
          e.preventDefault();
          this.exportStudio.close();
          return;
        }
        if (this.studioPanel && this.studioPanel.isOpen) {
          e.preventDefault();
          this.studioPanel.close();
          return;
        }
        return;
      }

      const activeTag = document.activeElement ? document.activeElement.tagName : '';
      const isFormInput =
        activeTag === 'INPUT' ||
        activeTag === 'TEXTAREA' ||
        activeTag === 'SELECT' ||
        (document.activeElement && document.activeElement.isContentEditable);

      if (isFormInput) {
        const inputType = document.activeElement.getAttribute('type') || '';
        if (inputType !== 'range' && inputType !== 'checkbox') {
          return;
        }
      }

      if (e.ctrlKey || e.metaKey || e.altKey) return;

      if (e.code === 'Space') {
        e.preventDefault();
        if (this.audioEngine.getPlaylist().length > 0) {
          this.audioEngine.togglePlay();
        } else {
          const cur = this.store.getState().effects.warpActive;
          this.store.updateSection('effects', { warpActive: !cur });
        }
      } else if (e.key === 's' || e.key === 'S') {
        e.preventDefault();
        if (this.dock.uiHidden) this.dock.setUiHidden(false);
        this.studioPanel.toggle();
      } else if (e.key === 'o' || e.key === 'O') {
        e.preventDefault();
        const cam = this.store.getState().camera;
        const nextOrbit = !cam.autoOrbit;
        this.store.updateSection('camera', {
          autoOrbit: nextOrbit,
          staticLock: nextOrbit ? false : cam.staticLock
        });
      } else if (e.key === 'l' || e.key === 'L') {
        e.preventDefault();
        const cam = this.store.getState().camera;
        const nextLock = !cam.staticLock;
        this.store.updateSection('camera', {
          staticLock: nextLock,
          autoOrbit: nextLock ? false : cam.autoOrbit
        });
        this.notify(
          nextLock
            ? 'Static Pose Locked — Sway & cursor drift disabled.'
            : 'Static Pose Unlocked.',
          'info'
        );
      } else if (e.key === 'w' || e.key === 'W') {
        e.preventDefault();
        const cur = this.store.getState().effects.warpActive;
        this.store.updateSection('effects', { warpActive: !cur });
      } else if (e.key === 'h' || e.key === 'H') {
        e.preventDefault();
        this.dock.toggleUiHidden();
      } else if (e.key === 'r' || e.key === 'R') {
        e.preventDefault();
        this.store.resetAll();
        this.sceneEngine.resetViewOrientation();
        this.presetManager.persistActiveState();
        this.notify('All settings restored to factory ERATIS defaults.', 'success');
      } else if (e.key === 'ArrowLeft') {
        if (this.audioEngine.getPlaylist().length > 0) {
          e.preventDefault();
          this.audioEngine.prevTrack();
        }
      } else if (e.key === 'ArrowRight') {
        if (this.audioEngine.getPlaylist().length > 0) {
          e.preventDefault();
          this.audioEngine.nextTrack(true);
        }
      }
    });
  }

  _bindLifecycleCleanup() {
    window.addEventListener('beforeunload', () => {
      this.presetManager.persistActiveState();
      this.exportStudio.dispose();
      this.studioPanel.dispose();
      this.dock.dispose();
      this.signatureIntro.dispose();
      this.audioEngine.dispose();
      this.sceneEngine.dispose();
    });
  }
}

function bootEratisStudio() {
  if (window.__ERATIS_STUDIO__) return;
  window.__ERATIS_STUDIO__ = new EratisStudioApp();
}

if (document.readyState === 'loading') {
  window.addEventListener('DOMContentLoaded', bootEratisStudio);
} else {
  bootEratisStudio();
}

      })();
    }
  </script>
