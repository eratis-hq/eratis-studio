    this._emit('playlistchange', { playlist: this.playlist, currentIndex: this.currentIndex });

    if (wasEmpty && autoPlayFirst) {
      this.selectTrack(0, true);
    }
    return added;
  }

  removeTrack(index) {
    if (index < 0 || index >= this.playlist.length) return;
    const [removed] = this.playlist.splice(index, 1);
    if (removed && removed.url) {
      URL.revokeObjectURL(removed.url);
    }

    if (this.playlist.length === 0) {
      this.currentIndex = -1;
      if (this.audioEl) {
        this.audioEl.pause();
        this.audioEl.removeAttribute('src');
        this.audioEl.load();
      }
      this.isPlaying = false;
      this._emit('playstate', { isPlaying: false });
      this._emit('trackchange', { track: null, currentIndex: -1 });
      this._emit('playlistchange', { playlist: this.playlist, currentIndex: -1 });
      return;
    }

    if (index === this.currentIndex) {
      const nextIdx = Math.min(index, this.playlist.length - 1);
      this.selectTrack(nextIdx, this.isPlaying);
    } else if (index < this.currentIndex) {
      this.currentIndex -= 1;
    }
    this._emit('playlistchange', { playlist: this.playlist, currentIndex: this.currentIndex });
  }

  clearPlaylist() {
    if (this.audioEl) {
      this.audioEl.pause();
      this.audioEl.removeAttribute('src');
      this.audioEl.load();
    }
    for (const track of this.playlist) {
      if (track.url) URL.revokeObjectURL(track.url);
    }
    this.playlist = [];
    this.currentIndex = -1;
    this.isPlaying = false;
    this._emit('playstate', { isPlaying: false });
    this._emit('trackchange', { track: null, currentIndex: -1 });
    this._emit('playlistchange', { playlist: this.playlist, currentIndex: -1 });
  }

  async selectTrack(index, autoPlay = true) {
    if (index < 0 || index >= this.playlist.length || !this.audioEl) return false;
    this.currentIndex = index;
    const track = this.playlist[index];

    this.audioEl.src = track.url;
    this.audioEl.currentTime = 0;
    this._emit('trackchange', { track, currentIndex: this.currentIndex });
    this._emit('playlistchange', { playlist: this.playlist, currentIndex: this.currentIndex });

    if (autoPlay) {
      return this.play();
    }
    return true;
  }

  async play() {
    if (!this.audioEl || this.playlist.length === 0) return false;
    if (this.currentIndex < 0) {
      return this.selectTrack(0, true);
    }
    this._ensureGraph();
    try {
      await this.audioEl.play();
      return true;
    } catch (_) {
      this.isPlaying = false;
      this._emit('playstate', { isPlaying: false });
      return false;
    }
  }

  pause() {
    if (!this.audioEl) return;
    this.audioEl.pause();
  }

  async togglePlay() {
    if (this.playlist.length === 0) return false;
    if (this.isPlaying) {
      this.pause();
      return false;
    }
    return this.play();
  }

  seekTo(seconds) {
    if (!this.audioEl || !Number.isFinite(this.audioEl.duration)) return;
    const clamped = Math.max(0, Math.min(this.audioEl.duration, Number(seconds) || 0));
    this.audioEl.currentTime = clamped;
    this._emit('timeupdate', {
      currentTime: clamped,
      duration: this.audioEl.duration
    });
  }

  seekByProgress(ratio) {
    if (!this.audioEl || !Number.isFinite(this.audioEl.duration)) return;
    const clamped = Math.max(0, Math.min(1, Number(ratio) || 0));
    this.seekTo(clamped * this.audioEl.duration);
  }

  nextTrack(manual = true) {
    if (this.playlist.length === 0) return;
    const audioCfg = this.store ? this.store.getState().audio : { shuffle: false, repeat: 'off' };

    if (audioCfg.shuffle && this.playlist.length > 1) {
      let nextIdx = this.currentIndex;
      while (nextIdx === this.currentIndex) {
        nextIdx = Math.floor(Math.random() * this.playlist.length);
      }
      this.selectTrack(nextIdx, true);
      return;
    }

    const nextIdx = this.currentIndex + 1;
    if (nextIdx < this.playlist.length) {
      this.selectTrack(nextIdx, true);
    } else if (manual || audioCfg.repeat === 'all') {
      this.selectTrack(0, true);
    } else {
      this.pause();
      this.seekTo(0);
    }
  }

  prevTrack() {
    if (this.playlist.length === 0) return;
    if (this.audioEl && this.audioEl.currentTime > 3.0) {
      this.seekTo(0);
      return;
    }
    const prevIdx = (this.currentIndex - 1 + this.playlist.length) % this.playlist.length;
    this.selectTrack(prevIdx, true);
  }

  _handleTrackEnded() {
    const audioCfg = this.store ? this.store.getState().audio : { repeat: 'off' };
    if (audioCfg.repeat === 'one') {
      this.seekTo(0);
      this.play();
      return;
    }
    this.nextTrack(false);
  }

  sample(dt = 0.016) {
    if (!this.isPlaying || !this.analyser || !this.freqData || !this.audioContext) {
      this.levels.bass = decayEnergyValue(this.levels.bass, dt, 5.2);
      this.levels.mid = decayEnergyValue(this.levels.mid, dt, 5.2);
      this.levels.treble = decayEnergyValue(this.levels.treble, dt, 5.2);
      return this.levels;
    }

    this.analyser.getByteFrequencyData(this.freqData);
    const sr = this.audioContext.sampleRate || 44100;
    const fftSize = this.analyser.fftSize || AUDIO_BANDS.FFT_SIZE;

    const bassRange = computeBandBinRange(AUDIO_BANDS.BASS.minHz, AUDIO_BANDS.BASS.maxHz, sr, fftSize);
    const midRange = computeBandBinRange(AUDIO_BANDS.MID.minHz, AUDIO_BANDS.MID.maxHz, sr, fftSize);
    const trebleRange = computeBandBinRange(AUDIO_BANDS.TREBLE.minHz, AUDIO_BANDS.TREBLE.maxHz, sr, fftSize);

    const rawBass = computeNormalizedBandEnergy(this.freqData, bassRange.startBin, bassRange.endBin);
    const rawMid = computeNormalizedBandEnergy(this.freqData, midRange.startBin, midRange.endBin);
    const rawTreble = computeNormalizedBandEnergy(this.freqData, trebleRange.startBin, trebleRange.endBin);

    const smooth = 1 - Math.exp(-14 * Math.min(0.05, dt));
    this.levels.bass += (Math.pow(rawBass, 1.15) - this.levels.bass) * smooth;
    this.levels.mid += (Math.pow(rawMid, 1.05) - this.levels.mid) * smooth;
    this.levels.treble += (Math.pow(rawTreble, 1.0) - this.levels.treble) * smooth;

    return this.levels;
  }

  dispose() {
    this.clearPlaylist();
    for (const cleanup of this._cleanups) {
      try {
        cleanup();
      } catch (_) {

      }
    }
    this._cleanups = [];
    this._listeners.clear();

    if (this.sourceNode) {
      try {
        this.sourceNode.disconnect();
      } catch (_) {}
    }
    if (this.analyser) {
      try {
        this.analyser.disconnect();
      } catch (_) {}
    }
    if (this.gainNode) {
      try {
        this.gainNode.disconnect();
      } catch (_) {}
    }
    if (this.audioContext && this.audioContext.state !== 'closed') {
      this.audioContext.close().catch(() => {});
    }
    this.audioContext = null;
    this.analyser = null;
    this.gainNode = null;
    this.recordDestination = null;
    this.freqData = null;
  }
}

function clampNum(val, min, max, fallback) {
  const n = Number(val);
  if (!Number.isFinite(n)) return fallback;
  return Math.max(min, Math.min(max, n));
}

function isValidHexColor(str) {
  return typeof str === 'string' && /^#[0-9a-fA-F]{6}$/.test(str.trim());
}

function stripLocalMediaForExport(stateSnapshot) {
  const clean = deepMerge(DEFAULT_STATE, stateSnapshot);
  const excluded = [];

  if (clean.identity.mode === 'image' || clean.identity.image.fileName) {
    excluded.push('local-image-file');
  }
  clean.identity.image = {
    opacity: clampNum(clean.identity.image.opacity, 0.05, 1.0, 1.0),
    scale: clampNum(clean.identity.image.scale, 0.2, 3.0, 1.0),
    fileName: ''
  };

  delete clean.audio.playlist;
  delete clean.audio.blobUrl;
  delete clean.identity.image.blobUrl;
  delete clean.identity.image.dataUrl;

  return {
    state: clean,
    localMediaExcluded: true,
    excludedTypes: excluded,
    privacyNote:
      'Local audio files, custom image uploads, and custom SVG signature files are intentionally excluded from JSON exports for user privacy.'
  };
}

function validatePresetPayload(payload) {
  const errors = [];
  const warnings = [];

  if (!payload || typeof payload !== 'object' || Array.isArray(payload)) {
    return { valid: false, errors: ['JSON root must be an object.'], warnings, sanitized: null };
  }

  if (payload.app && payload.app !== 'eratis-studio') {
    errors.push(`Unsupported application identifier: "${String(payload.app)}".`);
  }

  if (payload.schemaVersion && typeof payload.schemaVersion !== 'string') {
    errors.push('schemaVersion must be a semver string.');
  }

  const rawState = payload.state && typeof payload.state === 'object' ? payload.state : null;
  if (!rawState) {
    errors.push('Missing required "state" object.');
    return { valid: false, errors, warnings, sanitized: null };
  }

  const serializedCheck = JSON.stringify(rawState);
  if (/data:(image|audio)\//i.test(serializedCheck) || /blob:http/i.test(serializedCheck)) {
    warnings.push('Local media data/blob URLs detected in JSON were stripped for privacy and portability.');
  }

  const sanitized = deepClone(DEFAULT_STATE);

  if (rawState.identity && typeof rawState.identity === 'object') {
    const id = rawState.identity;
    if (id.mode !== undefined) {
      if (IDENTITY_MODES.includes(id.mode)) {
        sanitized.identity.mode = id.mode;
      } else {
        errors.push(`Invalid identity.mode "${String(id.mode)}". Allowed: ${IDENTITY_MODES.join(', ')}.`);
      }
    }
    if (id.material !== undefined) {
      if (MATERIAL_IDS.includes(id.material)) {
        sanitized.identity.material = id.material;
      } else {
        errors.push(`Invalid identity.material "${String(id.material)}".`);
      }
    }
    if (id.showOrbits !== undefined) sanitized.identity.showOrbits = Boolean(id.showOrbits);
    sanitized.identity.positionX = clampNum(id.positionX, -10, 10, DEFAULT_STATE.identity.positionX);
    sanitized.identity.positionY = clampNum(id.positionY, -8, 8, DEFAULT_STATE.identity.positionY);
    sanitized.identity.scale = clampNum(id.scale, 0.25, 2.5, DEFAULT_STATE.identity.scale);
    sanitized.identity.rotationX = clampNum(id.rotationX, -180, 180, DEFAULT_STATE.identity.rotationX);
    sanitized.identity.rotationY = clampNum(id.rotationY, -180, 180, DEFAULT_STATE.identity.rotationY);
    sanitized.identity.rotationZ = clampNum(id.rotationZ, -180, 180, DEFAULT_STATE.identity.rotationZ);

    if (id.text && typeof id.text === 'object') {
      const t = id.text;
      sanitized.identity.text.value =
        typeof t.value === 'string' && t.value.trim().length > 0
          ? t.value.slice(0, 48)
          : DEFAULT_STATE.identity.text.value;
      if (t.font !== undefined) {
        if (FONT_IDS.includes(t.font) || (typeof t.font === 'string' && t.font.startsWith('custom_font_'))) {
          sanitized.identity.text.font = t.font;
        } else {
          warnings.push(`Unknown font "${String(t.font)}", reverted to default.`);
        }
      }
      sanitized.identity.text.letterSpacing = clampNum(t.letterSpacing, -0.2, 1.2, DEFAULT_STATE.identity.text.letterSpacing);
      sanitized.identity.text.italicSlant = clampNum(t.italicSlant, -0.6, 0.8, DEFAULT_STATE.identity.text.italicSlant);
      sanitized.identity.text.depth = clampNum(t.depth, 0.05, 2.5, DEFAULT_STATE.identity.text.depth);
      sanitized.identity.text.bevelSize = clampNum(t.bevelSize, 0, 0.35, DEFAULT_STATE.identity.text.bevelSize);
      sanitized.identity.text.bevelThickness = clampNum(t.bevelThickness, 0, 0.45, DEFAULT_STATE.identity.text.bevelThickness);
    }

    if (id.image && typeof id.image === 'object') {
      sanitized.identity.image.opacity = clampNum(id.image.opacity, 0.05, 1.0, 1.0);
      sanitized.identity.image.scale = clampNum(id.image.scale, 0.2, 3.0, 1.0);
      sanitized.identity.image.fileName = '';
    }

    if (sanitized.identity.mode === 'image') {
      warnings.push('Imported preset uses "image" mode. Local images are not embedded in JSON — upload an image or switch to ERATIS/Text.');
    }
  }

  if (rawState.environment && typeof rawState.environment === 'object') {
    const env = rawState.environment;
    if (env.backgroundColor !== undefined) {
      if (isValidHexColor(env.backgroundColor)) {
        sanitized.environment.backgroundColor = env.backgroundColor.trim();
      } else {
        errors.push(`Invalid environment.backgroundColor "${String(env.backgroundColor)}". Expected #RRGGBB.`);
      }
    }
    sanitized.environment.fogDensity = clampNum(env.fogDensity, 0, 0.04, DEFAULT_STATE.environment.fogDensity);
    sanitized.environment.exposure = clampNum(env.exposure, 0.4, 3.0, DEFAULT_STATE.environment.exposure);
    sanitized.environment.reflectionIntensity = clampNum(env.reflectionIntensity, 0.1, 2.5, DEFAULT_STATE.environment.reflectionIntensity);
    sanitized.environment.keyLightIntensity = clampNum(env.keyLightIntensity, 0, 6.0, DEFAULT_STATE.environment.keyLightIntensity);
    sanitized.environment.rimLightIntensity = clampNum(env.rimLightIntensity, 0, 6.0, DEFAULT_STATE.environment.rimLightIntensity);
    sanitized.environment.cursorLightIntensity = clampNum(env.cursorLightIntensity, 0, 6.0, DEFAULT_STATE.environment.cursorLightIntensity);
    if (env.starfieldEnabled !== undefined) sanitized.environment.starfieldEnabled = Boolean(env.starfieldEnabled);
    sanitized.environment.starCount = Math.round(clampNum(env.starCount, 200, 5000, DEFAULT_STATE.environment.starCount));
    sanitized.environment.starSpeed = clampNum(env.starSpeed, 0.1, 4.0, DEFAULT_STATE.environment.starSpeed);
    sanitized.environment.starSize = clampNum(env.starSize, 0.08, 0.8, DEFAULT_STATE.environment.starSize);
    sanitized.environment.starBrightness = clampNum(env.starBrightness, 0.1, 1.0, DEFAULT_STATE.environment.starBrightness);
  }

  if (rawState.audio && typeof rawState.audio === 'object') {
    const a = rawState.audio;
    if (a.reactive !== undefined) sanitized.audio.reactive = Boolean(a.reactive);
    sanitized.audio.bassSensitivity = clampNum(a.bassSensitivity, 0, 2.5, DEFAULT_STATE.audio.bassSensitivity);
    sanitized.audio.midTrebleSensitivity = clampNum(a.midTrebleSensitivity, 0, 2.5, DEFAULT_STATE.audio.midTrebleSensitivity);
    sanitized.audio.volume = clampNum(a.volume, 0, 1, DEFAULT_STATE.audio.volume);
    if (a.muted !== undefined) sanitized.audio.muted = Boolean(a.muted);
    if (a.shuffle !== undefined) sanitized.audio.shuffle = Boolean(a.shuffle);
    if (a.repeat !== undefined) {
      if (REPEAT_MODES.includes(a.repeat)) {
        sanitized.audio.repeat = a.repeat;
      } else {
        errors.push(`Invalid audio.repeat "${String(a.repeat)}".`);
      }
    }
  }

  if (rawState.camera && typeof rawState.camera === 'object') {
    const c = rawState.camera;
    sanitized.camera.distance = clampNum(c.distance, 11, 42, DEFAULT_STATE.camera.distance);
    sanitized.camera.fov = clampNum(c.fov, 22, 75, DEFAULT_STATE.camera.fov);
    if (c.autoOrbit !== undefined) sanitized.camera.autoOrbit = Boolean(c.autoOrbit);
    sanitized.camera.orbitSpeed = clampNum(c.orbitSpeed, 0.05, 2.5, DEFAULT_STATE.camera.orbitSpeed);
    sanitized.camera.parallaxStrength = clampNum(c.parallaxStrength, 0, 2.5, DEFAULT_STATE.camera.parallaxStrength);
    if (c.idleSway !== undefined) sanitized.camera.idleSway = Boolean(c.idleSway);
    if (c.staticLock !== undefined) sanitized.camera.staticLock = Boolean(c.staticLock);
  }

  if (rawState.effects && typeof rawState.effects === 'object') {
    const ef = rawState.effects;
    if (ef.warpActive !== undefined) sanitized.effects.warpActive = Boolean(ef.warpActive);
    sanitized.effects.warpIntensity = clampNum(ef.warpIntensity, 0.2, 2.5, DEFAULT_STATE.effects.warpIntensity);
    if (ef.lensFlares !== undefined) sanitized.effects.lensFlares = Boolean(ef.lensFlares);
    sanitized.effects.flareIntensity = clampNum(ef.flareIntensity, 0, 2.5, DEFAULT_STATE.effects.flareIntensity);
    sanitized.effects.vignetteStrength = clampNum(ef.vignetteStrength, 0, 1.0, DEFAULT_STATE.effects.vignetteStrength);
  }

  const name =
    typeof payload.name === 'string' && payload.name.trim().length > 0
      ? payload.name.trim().slice(0, 60)
      : 'Imported ERATIS Preset';

  return {
    valid: errors.length === 0,
    errors,
    warnings,
    sanitized: errors.length === 0 ? { name, state: sanitized } : null
  };
}

class PresetManager {
  constructor(store, storage = null) {
    this.store = store;
    this.storage = storage || (typeof window !== 'undefined' && window.localStorage ? window.localStorage : null);
    this.customPresets = this._loadCustomPresets();
    this.activePresetId = BUILTIN_PRESETS[0].id;
    this._listeners = new Set();
  }

  subscribe(listener) {
    this._listeners.add(listener);
    return () => this._listeners.delete(listener);
  }

  _notify() {
    const all = this.listPresets();
    for (const listener of this._listeners) {
      listener(all, this.activePresetId);
    }
  }

  _loadCustomPresets() {
    if (!this.storage) return [];
    try {
      const raw = this.storage.getItem(STORAGE_KEYS.CUSTOM_PRESETS);
      if (!raw) return [];
      const parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) return [];

      const validList = [];
      for (const item of parsed) {
        const res = validatePresetPayload(item);
        if (res.valid && res.sanitized) {
          validList.push({
            id: typeof item.id === 'string' && item.id ? item.id : `custom-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
            name: res.sanitized.name,
            builtin: false,
            createdAt: item.createdAt || new Date().toISOString(),
            state: res.sanitized.state
          });
        }
      }
      return validList;
    } catch (_) {
      return [];
    }
  }

  _persistCustomPresets() {
    if (!this.storage) return;
    try {
      this.storage.setItem(STORAGE_KEYS.CUSTOM_PRESETS, JSON.stringify(this.customPresets));
    } catch (_) {

    }
  }

  persistActiveState() {
    if (!this.storage || !this.store) return;
    try {
      const stripped = stripLocalMediaForExport(this.store.getSnapshot());
      this.storage.setItem(STORAGE_KEYS.ACTIVE_STATE, JSON.stringify(stripped.state));
    } catch (_) {

    }
  }

  restoreActiveState() {
    if (!this.storage || !this.store) return false;
    try {
      const raw = this.storage.getItem(STORAGE_KEYS.ACTIVE_STATE);
      if (!raw) return false;
      const parsed = JSON.parse(raw);
      const res = validatePresetPayload({ app: 'eratis-studio', schemaVersion: APP_INFO.schemaVersion, state: parsed });
      if (res.valid && res.sanitized) {

        if (res.sanitized.state.identity.mode === 'image') {
          res.sanitized.state.identity.mode = 'eratis';
        }
        this.store.replaceState(res.sanitized.state, 'all');
        return true;
      }
      return false;
    } catch (_) {
      return false;
    }
  }

  listPresets() {
    return [
      ...BUILTIN_PRESETS.map((p) => ({ ...p, state: deepClone(p.state) })),
      ...this.customPresets.map((p) => ({ ...p, state: deepClone(p.state) }))
    ];
  }

  getPresetById(id) {
    return this.listPresets().find((p) => p.id === id) || null;
  }

  applyPreset(id) {
    const preset = this.getPresetById(id);
    if (!preset) return null;
    this.activePresetId = preset.id;
    this.store.replaceState(preset.state, 'all');
    this.persistActiveState();
    this._notify();
    return preset;
  }

  saveCustomPreset(name) {
    const cleanName = (name || '').trim().slice(0, 60);
    if (!cleanName) {
      throw new Error('Preset name cannot be empty.');
    }

    const stripped = stripLocalMediaForExport(this.store.getSnapshot());
    const existing = this.customPresets.find((p) => p.name.toLowerCase() === cleanName.toLowerCase());

    if (existing) {
      existing.name = cleanName;
      existing.state = stripped.state;
      existing.updatedAt = new Date().toISOString();
      this.activePresetId = existing.id;
      this._persistCustomPresets();
      this._notify();
      return { preset: deepClone(existing), updated: true, privacyNote: stripped.privacyNote };
    }

    const preset = {
      id: `custom-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
      name: cleanName,
      builtin: false,
      createdAt: new Date().toISOString(),
      state: stripped.state
    };
    this.customPresets.push(preset);
    this.activePresetId = preset.id;
    this._persistCustomPresets();
    this._notify();
    return { preset: deepClone(preset), updated: false, privacyNote: stripped.privacyNote };
  }

  deleteCustomPreset(id) {
    const idx = this.customPresets.findIndex((p) => p.id === id);
    if (idx === -1) return false;
    this.customPresets.splice(idx, 1);
    if (this.activePresetId === id) {
      this.activePresetId = BUILTIN_PRESETS[0].id;
    }
    this._persistCustomPresets();
    this._notify();
    return true;
  }

  exportSceneJSON(presetName = 'ERATIS Scene') {
    const stripped = stripLocalMediaForExport(this.store.getSnapshot());
    const payload = {
      app: 'eratis-studio',
      schemaVersion: APP_INFO.schemaVersion,
      name: (presetName || 'ERATIS Scene').trim().slice(0, 60),
      exportedAt: new Date().toISOString(),
      metadata: {
        localMediaExcluded: stripped.localMediaExcluded,
        excludedTypes: stripped.excludedTypes,
        privacyNote: stripped.privacyNote
      },
      state: stripped.state
    };
    return {
      payload,
      json: JSON.stringify(payload, null, 2)
    };
  }

  importSceneJSON(jsonText, { saveAsCustom = true, applyImmediately = true } = {}) {
    let parsed;
    try {
      parsed = JSON.parse(jsonText);
    } catch (err) {
      return {
        ok: false,
        errors: [`Invalid JSON syntax: ${err.message}`],
        warnings: []
      };
    }

    const validation = validatePresetPayload(parsed);
    if (!validation.valid || !validation.sanitized) {
      return {
        ok: false,
        errors: validation.errors,
        warnings: validation.warnings
      };
    }

    const { name, state } = validation.sanitized;

    if (applyImmediately) {

      const nextState = deepClone(state);
      this.store.replaceState(nextState, 'all');
      this.persistActiveState();
    }

    let savedPreset = null;
    if (saveAsCustom) {
      const preset = {
        id: `custom-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
        name,
        builtin: false,
        createdAt: new Date().toISOString(),
        state
      };
      this.customPresets.push(preset);
      this.activePresetId = preset.id;
      this._persistCustomPresets();
      this._notify();
      savedPreset = deepClone(preset);
    }

    return {
      ok: true,
      preset: savedPreset,
      state,
      errors: [],
      warnings: validation.warnings
    };
  }
}

class SceneEngine {
  constructor({ container, store, audioEngine, onNotify, onContextChange }) {
    this.container = container;
    this.store = store;
    this.audioEngine = audioEngine;
    this.onNotify = onNotify || (() => {});
    this.onContextChange = onContextChange || (() => {});

    this.scene = null;
    this.camera = null;
    this.renderer = null;
    this.materialManager = null;
    this.textBuilder = null;
    this.imageLayer = null;
    this.starfield = null;

    this.emblemGroup = null;
    this.transformGroup = null;
    this.eratisGroup = null;
    this.swooshGroup = null;
    this.flareData = null;

    this.lights = {
      ambient: null,
      key: null,
      rim: null,
      cursor: null,
      fill: null
    };

    this.interactiveMeshes = [];
    this.raycaster = null;
    this.pointerNDC = null;

    this.isDragging = false;
    this.dragDistance = 0;
    this.prevPointer = { x: 0, y: 0 };
    this.dragOffset = { x: 0, y: 0 };
    this.dragVelocity = { x: 0, y: 0 };
    this.pointerNorm = { x: 0, y: 0 };
    this.smoothPointer = { x: 0, y: 0 };
    this.isHoveringLogo = false;

    this.orbitAngle = 0;
    this.warpFactor = 0;
    this.revealProgress = 0;
    this.revealActive = false;
    this.currentZoomZ = 31.0;

    this.reactive = {
      bass: 0,
      mid: 0,
      treble: 0
    };

    this._lastTextSignature = '';
    this._textDebounceTimer = null;
    this._textReportListeners = new Set();

    this._rafId = null;
    this._lastTime = performance.now();
    this._contextLost = false;
    this._disposed = false;
    this._cleanups = [];

    this._init();
  }

  _init() {
    const THREE = getTHREE();
    const state = this.store.getState();

    this.raycaster = new THREE.Raycaster();
    this.pointerNDC = new THREE.Vector2();

    const bgColor = new THREE.Color(state.environment.backgroundColor || '#000000');
    this.scene = new THREE.Scene();
    this.scene.fog = new THREE.FogExp2(bgColor.getHex(), state.environment.fogDensity);

    const width = this.container.clientWidth || window.innerWidth;
    const height = this.container.clientHeight || window.innerHeight;
    this.camera = new THREE.PerspectiveCamera(state.camera.fov, width / height, 0.1, 260);
    this.currentZoomZ = state.camera.distance + 5.5;
    this.camera.position.set(0, 0, this.currentZoomZ);

    this.renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true,
      preserveDrawingBuffer: true,
      powerPreference: 'high-performance'
    });
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    this.renderer.setSize(width, height);
    this.renderer.setClearColor(bgColor, 1);
    this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
    this.renderer.toneMappingExposure = state.environment.exposure;
    this.renderer.outputEncoding = THREE.sRGBEncoding;
    this.container.appendChild(this.renderer.domElement);

    this.materialManager = new MaterialManager();
    this.scene.environment = this.materialManager.getEnvMap();
    const activeMat = this.materialManager.getMaterial(state.identity.material);

    this.lights.ambient = new THREE.AmbientLight(0xffffff, 0.42);
    this.scene.add(this.lights.ambient);

    this.lights.key = new THREE.DirectionalLight(0xffffff, state.environment.keyLightIntensity);
    this.lights.key.position.set(8, 12, 16);
    this.scene.add(this.lights.key);

    this.lights.rim = new THREE.DirectionalLight(0xe6e8ec, state.environment.rimLightIntensity);
    this.lights.rim.position.set(-10, -8, 14);
    this.scene.add(this.lights.rim);

    this.lights.cursor = new THREE.PointLight(0xffffff, state.environment.cursorLightIntensity, 58);
    this.lights.cursor.position.set(0, 3, 15);
    this.scene.add(this.lights.cursor);

    this.lights.fill = new THREE.PointLight(0xd1d5db, 1.65, 55);
    this.lights.fill.position.set(6, -4, 14);
    this.scene.add(this.lights.fill);

    this.emblemGroup = new THREE.Group();
    this.emblemGroup.name = 'eratis-emblem-root';
    this.scene.add(this.emblemGroup);

    this.transformGroup = new THREE.Group();
    this.transformGroup.name = 'eratis-user-transform';
    this.emblemGroup.add(this.transformGroup);

    this.eratisGroup = createEratisLetters(activeMat);
    this.transformGroup.add(this.eratisGroup);

    this.textBuilder = new TextBuilder();
    this.textBuilder.getGroup().visible = false;
    this.transformGroup.add(this.textBuilder.getGroup());

    this.imageLayer = new ImageLayer();
    this.imageLayer.getGroup().visible = false;
    this.transformGroup.add(this.imageLayer.getGroup());

    this.swooshGroup = createOrbitalSwooshes(activeMat);
    this.transformGroup.add(this.swooshGroup);

    const flareTexture = createStarburstTexture();
    this.flareData = createOrbitalFlares(flareTexture);
    this.swooshGroup.add(this.flareData.group);

    this.backlightTexture = createBacklightHaloTexture();
    const backlightMat = new THREE.SpriteMaterial({
      map: this.backlightTexture,
      transparent: true,
      opacity: 0.85,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    this.backlightSprite = new THREE.Sprite(backlightMat);
    this.backlightSprite.position.set(0, 0, -2.6);
    this.backlightSprite.scale.set(16.5, 9.2, 1);
    this.scene.add(this.backlightSprite);

    this.starfield = new Starfield(this.scene, state.environment.starCount);

    this.emblemGroup.scale.setScalar(0.84);
    this.revealProgress = 0;

    this._bindEvents();
    this._syncFromState(state, 'all');

    const unsubscribe = this.store.subscribe((nextState, section) => {
      this._syncFromState(nextState, section);
    });
    this._cleanups.push(unsubscribe);

    this._lastTime = performance.now();
    this._startLoop();
  }

  getCanvas() {
    return this.renderer ? this.renderer.domElement : null;
  }

  triggerIntroReveal(immediate = false) {
    this.revealActive = true;
    if (immediate) {
      this.revealProgress = 1;
      this.emblemGroup.scale.setScalar(1);
      this.currentZoomZ = this.store.getState().camera.distance;
    } else {
      this.revealProgress = 0;
      this.emblemGroup.scale.setScalar(0.84);
      this.currentZoomZ = this.store.getState().camera.distance + 5.5;
    }
  }

  resetViewOrientation() {
    this.dragOffset.x = 0;
    this.dragOffset.y = 0;
    this.dragVelocity.x = 0;
    this.dragVelocity.y = 0;
    this.orbitAngle = 0;
    this.store.updateSection('camera', { distance: 25.5 });
  }

  async loadCustomImage(file) {
    const maxAniso = this.renderer ? this.renderer.capabilities.getMaxAnisotropy() : 4;
    const meta = await this.imageLayer.loadFile(file, maxAniso);
    this.store.updateSection('identity', {
      mode: 'image',
      image: { fileName: meta.fileName }
    });
    this._refreshInteractiveMeshes();
    return meta;
  }

  async loadCustomFont(file) {
    const entry = await this.textBuilder.loadCustomFontFile(file);
    this.store.updateSection('identity', {
      mode: 'text',
      text: { font: entry.id }
    });
    return entry;
  }

  deleteFont(fontId) {
    if (!this.textBuilder) return null;
    const res = this.textBuilder.deleteFont(fontId);
    const curFont = this.store.getState().identity.text.font;
    if (curFont === fontId && res.nextFontId) {
      this.store.updateSection('identity', {
        text: { font: res.nextFontId }
      });
    }
    return res;
  }

  restoreDefaultFonts() {
    if (!this.textBuilder) return [];
    return this.textBuilder.restoreDefaultFonts();
  }

  getAvailableFonts() {
    return this.textBuilder ? this.textBuilder.getAvailableFonts() : [];
  }

  clearCustomImage() {
    this.imageLayer.clear();
    this.store.updateSection('identity', {
      image: { fileName: '' }
    });
    if (this.store.getState().identity.mode === 'image') {
      this.store.resetIdentityToEratis();
    }
    this._refreshInteractiveMeshes();
  }

  hasCustomImage() {
    return this.imageLayer ? this.imageLayer.hasImage() : false;
  }

  _applyStudioMaterial(materialId) {
    const mat = this.materialManager.getMaterial(materialId);
    const apply = (group) => {
      if (!group) return;
      group.traverse((obj) => {
        if (obj.isMesh && obj.userData.isStudioMaterialTarget) {
          obj.material = mat;
        }
      });
    };
    apply(this.eratisGroup);
    apply(this.swooshGroup);
    this.textBuilder.applyMaterial(mat);
  }

  _syncFromState(state, section) {
    const THREE = getTHREE();
    const { identity, environment, camera, effects } = state;

    if (section === 'all' || section === 'identity') {
      this._applyStudioMaterial(identity.material);

      this.eratisGroup.visible = identity.mode === 'eratis';
      this.textBuilder.getGroup().visible = identity.mode === 'text';
      this.imageLayer.getGroup().visible = identity.mode === 'image';
      this.swooshGroup.visible = Boolean(identity.showOrbits);

      this.transformGroup.position.set(identity.positionX, identity.positionY, 0);
      this.transformGroup.scale.setScalar(identity.scale);
      this.transformGroup.rotation.set(
        THREE.MathUtils.degToRad(identity.rotationX),
        THREE.MathUtils.degToRad(identity.rotationY),
        THREE.MathUtils.degToRad(identity.rotationZ)
      );

      this.imageLayer.setOpacity(identity.image.opacity);
      this.imageLayer.setLayerScale(identity.image.scale);

      if (identity.mode === 'text') {
        const sig = JSON.stringify(identity.text);
        if (sig !== this._lastTextSignature) {
          this._lastTextSignature = sig;
          this._scheduleTextRebuild(identity.text);
        }
      }

      this._refreshInteractiveMeshes();
    }

    if (section === 'all' || section === 'environment') {
      const bg = new THREE.Color(environment.backgroundColor || '#000000');
      this.renderer.setClearColor(bg, 1);
      if (this.scene.fog) {
        this.scene.fog.color.copy(bg);
        this.scene.fog.density = environment.fogDensity;
      }
      this.renderer.toneMappingExposure = environment.exposure;
      this.starfield.setVisible(environment.starfieldEnabled);
      this.starfield.setCount(environment.starCount);
    }

    if (section === 'all' || section === 'camera') {
      if (this.camera && Math.abs(this.camera.fov - camera.fov) > 0.01) {
        this.camera.fov = camera.fov;
        this.camera.updateProjectionMatrix();
      }
    }

    if (section === 'all' || section === 'effects' || section === 'identity') {
      if (this.flareData && this.flareData.group) {
        this.flareData.group.visible = Boolean(effects.lensFlares && identity.showOrbits);
      }
      document.documentElement.style.setProperty(
        '--vignette-opacity',
        String(Math.max(0, Math.min(1, effects.vignetteStrength)))
      );
    }
  }

  onTextBuildReport(listener) {
    if (typeof listener !== 'function') return () => {};
    this._textReportListeners.add(listener);
    if (this.textBuilder) {
      listener(this.textBuilder.getLastBuildReport());
    }
    return () => this._textReportListeners.delete(listener);
  }

  _scheduleTextRebuild(textConfig) {
    if (this._textDebounceTimer) {
      clearTimeout(this._textDebounceTimer);
    }
    this._textDebounceTimer = setTimeout(async () => {
      this._textDebounceTimer = null;
      const activeMat = this.materialManager.getActiveMaterial();
      const built = await this.textBuilder.build(textConfig, activeMat, (msg, level = 'warning') => {
        this.onNotify(msg, level);
      });
      if (built) {
        this._refreshInteractiveMeshes();
        const report = this.textBuilder.getLastBuildReport();
        for (const listener of this._textReportListeners) {
          try {
            listener(report);
          } catch (_) {}
        }
      }
    }, 65);
  }

  _refreshInteractiveMeshes() {
    this.interactiveMeshes = [];
    const mode = this.store.getState().identity.mode;
    const primaryTarget =
      mode === 'text'
        ? this.textBuilder.getGroup()
        : mode === 'image'
          ? this.imageLayer.getGroup()
          : this.eratisGroup;

    if (primaryTarget) {
      primaryTarget.traverse((obj) => {
        if (obj.isMesh) this.interactiveMeshes.push(obj);
      });
    }
    if (this.swooshGroup && this.swooshGroup.visible) {
      this.swooshGroup.traverse((obj) => {
        if (obj.isMesh) this.interactiveMeshes.push(obj);
      });
    }
  }

  _bindEvents() {
    const dom = this.renderer.domElement;

    const onPointerDown = (e) => {
      if (e.button !== 0) return;
      this.isDragging = true;
      this.dragDistance = 0;
      this.prevPointer.x = e.clientX;
      this.prevPointer.y = e.clientY;
      this.dragVelocity.x = 0;
      this.dragVelocity.y = 0;
    };

    const onPointerMove = (e) => {
      const rect = dom.getBoundingClientRect();
      this.pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      this.pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      this.pointerNorm.x = this.pointerNDC.x;
      this.pointerNorm.y = this.pointerNDC.y;

      if (!this.isDragging) {
        if (this.interactiveMeshes.length > 0 && e.target === dom) {
          this.raycaster.setFromCamera(this.pointerNDC, this.camera);
          const hits = this.raycaster.intersectObjects(this.interactiveMeshes, false);
          this.isHoveringLogo = hits.length > 0;
          this.container.style.cursor = this.isHoveringLogo ? 'pointer' : 'grab';
        }
        return;
      }

      const dx = e.clientX - this.prevPointer.x;
      const dy = e.clientY - this.prevPointer.y;
      this.dragDistance += Math.hypot(dx, dy);

      this.dragVelocity.y = dx * 0.0068;
      this.dragVelocity.x = dy * 0.0055;

      this.dragOffset.y += this.dragVelocity.y;
      this.dragOffset.x = Math.max(-0.95, Math.min(0.95, this.dragOffset.x + this.dragVelocity.x));

      this.prevPointer.x = e.clientX;
      this.prevPointer.y = e.clientY;
    };

    const onPointerUp = (e) => {
      if (!this.isDragging) return;
      this.isDragging = false;
      this.container.style.cursor = this.isHoveringLogo ? 'pointer' : 'grab';

      if (this.dragDistance < 6 && e.target === dom && this.store.getState().identity.mode === 'eratis') {
        const rect = dom.getBoundingClientRect();
        this.pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        this.pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        this.raycaster.setFromCamera(this.pointerNDC, this.camera);
        const hits = this.raycaster.intersectObjects(this.interactiveMeshes, false);
        if (hits.length > 0) {
          window.open(APP_INFO.githubUrl, '_blank', 'noopener,noreferrer');
        }
      }
    };

    const onWheel = (e) => {
      e.preventDefault();
      const currentDist = this.store.getState().camera.distance;
      const nextDist = Math.max(11, Math.min(42, Number((currentDist + e.deltaY * 0.012).toFixed(2))));
      this.store.updateSection('camera', { distance: nextDist });
    };

    const onDoubleClick = () => {
      this.resetViewOrientation();
    };

    const onResize = () => {
      if (!this.renderer || !this.camera) return;
      const w = this.container.clientWidth || window.innerWidth;
      const h = this.container.clientHeight || window.innerHeight;
      this.camera.aspect = w / h;
      this.camera.updateProjectionMatrix();
      this.renderer.setSize(w, h);
    };

    const onContextLost = (e) => {
      e.preventDefault();
      this._contextLost = true;
      this._stopLoop();
      this.onContextChange(true);
    };

    const onContextRestored = () => {
      this._contextLost = false;
      this._lastTime = performance.now();
      this._syncFromState(this.store.getState(), 'all');
      this.onContextChange(false);
      this._startLoop();
    };

    dom.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
    dom.addEventListener('wheel', onWheel, { passive: false });
    dom.addEventListener('dblclick', onDoubleClick);
    window.addEventListener('resize', onResize);
    dom.addEventListener('webglcontextlost', onContextLost, false);
    dom.addEventListener('webglcontextrestored', onContextRestored, false);

    this._cleanups.push(() => {
      dom.removeEventListener('pointerdown', onPointerDown);
      window.removeEventListener('pointermove', onPointerMove);
      window.removeEventListener('pointerup', onPointerUp);
      dom.removeEventListener('wheel', onWheel);
      dom.removeEventListener('dblclick', onDoubleClick);
      window.removeEventListener('resize', onResize);
      dom.removeEventListener('webglcontextlost', onContextLost);
      dom.removeEventListener('webglcontextrestored', onContextRestored);
    });
  }

  _startLoop() {
    if (this._rafId !== null || this._disposed || this._contextLost) return;
    const tick = () => {
      if (this._disposed || this._contextLost) return;
      this._rafId = requestAnimationFrame(tick);
      this._renderFrame();
    };
    this._rafId = requestAnimationFrame(tick);
  }

  _stopLoop() {
    if (this._rafId !== null) {
      cancelAnimationFrame(this._rafId);
      this._rafId = null;
    }
  }

  _renderFrame() {
    const now = performance.now();
    const dt = Math.min(Math.max((now - this._lastTime) * 0.001, 0.0001), 0.05);
    this._lastTime = now;
    const t = now * 0.001;

    const state = this.store.getState();
    const { environment, audio, camera: camCfg, effects } = state;

    const levels = this.audioEngine ? this.audioEngine.sample(dt) : { bass: 0, mid: 0, treble: 0 };
    const reactiveEnabled = Boolean(audio.reactive);
    const targetBass = reactiveEnabled ? levels.bass * audio.bassSensitivity : 0;
    const targetMid = reactiveEnabled ? levels.mid * audio.midTrebleSensitivity : 0;
    const targetTreble = reactiveEnabled ? levels.treble * audio.midTrebleSensitivity : 0;

    const reactLerp = 1 - Math.exp(-9.0 * dt);
    this.reactive.bass += (targetBass - this.reactive.bass) * reactLerp;
    this.reactive.mid += (targetMid - this.reactive.mid) * reactLerp;
    this.reactive.treble += (targetTreble - this.reactive.treble) * reactLerp;

    if (this.revealActive && this.revealProgress < 1) {
      this.revealProgress = Math.min(1, this.revealProgress + dt * 1.15);
      const easeOutCubic = 1 - Math.pow(1 - this.revealProgress, 3);
      this.emblemGroup.scale.setScalar(0.84 + 0.16 * easeOutCubic);
    }

    const pLerp = 1 - Math.exp(-5.5 * dt);
    this.smoothPointer.x += (this.pointerNorm.x - this.smoothPointer.x) * pLerp;
    this.smoothPointer.y += (this.pointerNorm.y - this.smoothPointer.y) * pLerp;

    const targetWarp = effects.warpActive ? effects.warpIntensity : 0;
    this.warpFactor += (targetWarp - this.warpFactor) * (1 - Math.exp(-4.5 * dt));

    const isLocked = Boolean(camCfg.staticLock);
    const activeParallax = isLocked ? 0 : camCfg.parallaxStrength;
    const effectiveZoomZ = camCfg.distance + this.warpFactor * 2.4;
    this.currentZoomZ += (effectiveZoomZ - this.currentZoomZ) * (1 - Math.exp(-5.0 * dt));
    this.camera.position.z = this.currentZoomZ;
    const targetCamX = this.smoothPointer.x * 0.65 * activeParallax;
    const targetCamY = this.smoothPointer.y * 0.45 * activeParallax;
    this.camera.position.x += (targetCamX - this.camera.position.x) * (1 - Math.exp(-8.0 * dt));
    this.camera.position.y += (targetCamY - this.camera.position.y) * (1 - Math.exp(-8.0 * dt));
    this.camera.lookAt(0, 0, 0);

    const midTrebleEnergy = this.reactive.mid * 0.55 + this.reactive.treble * 0.75;
    if (this.lights.cursor) {
      this.lights.cursor.position.x = this.smoothPointer.x * 11;
      this.lights.cursor.position.y = this.smoothPointer.y * 7 + 2;
      this.lights.cursor.intensity = environment.cursorLightIntensity * (1 + midTrebleEnergy * 0.7);
    }
    if (this.lights.key) {
      this.lights.key.intensity = environment.keyLightIntensity * (1 + this.reactive.mid * 0.35);
    }
    if (this.lights.rim) {
      this.lights.rim.intensity = environment.rimLightIntensity * (1 + this.reactive.treble * 0.55);
    }

    if (!this.isDragging) {
      this.dragOffset.y += this.dragVelocity.y;
      this.dragOffset.x += this.dragVelocity.x;
      this.dragVelocity.x *= Math.pow(0.06, dt);
      this.dragVelocity.y *= Math.pow(0.06, dt);
      this.dragOffset.x *= Math.pow(isLocked ? 0.04 : 0.25, dt);
      if (!camCfg.autoOrbit || isLocked) {
        this.dragOffset.y *= Math.pow(isLocked ? 0.04 : 0.45, dt);
      }
    }

    if (camCfg.autoOrbit && !isLocked && !this.isDragging) {
      this.orbitAngle += dt * (camCfg.orbitSpeed + this.warpFactor * 0.95);
    } else if (!camCfg.autoOrbit || isLocked) {
      this.orbitAngle *= Math.pow(isLocked ? 0.03 : 0.18, dt);
    }

    const allowSway = Boolean(camCfg.idleSway && !isLocked);
    const swayY = allowSway ? Math.sin(t * 0.45) * 0.42 : 0;
    const swayX = allowSway ? Math.cos(t * 0.35) * 0.05 : 0;
    const floatY = allowSway ? Math.sin(t * 1.05) * 0.14 : 0;

    const baseRotY = camCfg.autoOrbit && !isLocked
      ? this.orbitAngle
      : swayY + this.smoothPointer.x * 0.16 * activeParallax;
    const baseRotX = swayX - this.smoothPointer.y * 0.11 * activeParallax;

    this.emblemGroup.position.y += (floatY - this.emblemGroup.position.y) * (1 - Math.exp(-8.0 * dt));
    this.emblemGroup.rotation.y = baseRotY + this.dragOffset.y;
    this.emblemGroup.rotation.x = baseRotX + this.dragOffset.x;

    const bassReflectionBoost = this.reactive.bass * 1.15;
    this.materialManager.updateReflectionBoost(
      environment.reflectionIntensity,
      bassReflectionBoost,
      this.warpFactor * 0.32
    );

    if (this.swooshGroup) {
      const orbitScale = 1 + this.reactive.bass * 0.14;
      this.swooshGroup.scale.set(orbitScale, orbitScale, 1 + this.reactive.bass * 0.08);
    }

    if (this.flareData && this.flareData.group.visible) {
      const flareScaleMult =
        effects.flareIntensity *
        (1 + this.reactive.treble * 0.55 + this.reactive.mid * 0.25 + this.warpFactor * 0.22);

      const uBase = this.flareData.upperFlare.userData.baseScale;
      const lBase = this.flareData.lowerFlare.userData.baseScale;

      this.flareData.upperFlare.scale.set(uBase * flareScaleMult, uBase * flareScaleMult, 1);
      this.flareData.upperFlare.material.rotation = t * 0.24;

      this.flareData.lowerFlare.scale.set(lBase * flareScaleMult, lBase * flareScaleMult, 1);
      this.flareData.lowerFlare.material.rotation = -t * 0.24;
    }

    this.starfield.update(dt, {
      baseSpeed: environment.starSpeed,
      baseSize: environment.starSize,
      baseBrightness: environment.starBrightness,
      warpFactor: this.warpFactor,
      midEnergy: this.reactive.mid,
      trebleEnergy: this.reactive.treble
    });

    this.renderer.render(this.scene, this.camera);
  }

  captureSnapshot({
    width = 1920,
    height = 1080,
    transparent = false,
    hideStars = false,
    cinemaGrade = true,
    watermark = false
  } = {}) {
    if (!this.renderer || !this.scene || !this.camera) {
      throw new Error('Scene renderer is not initialized.');
    }

    const THREE = getTHREE();
    const prevSize = new THREE.Vector2();
    this.renderer.getSize(prevSize);
    const prevPixelRatio = this.renderer.getPixelRatio();
    const prevAspect = this.camera.aspect;
    const prevClearColor = new THREE.Color();
    this.renderer.getClearColor(prevClearColor);
    const prevClearAlpha = this.renderer.getClearAlpha();
    const prevFog = this.scene.fog;
    const prevStarsVisible = this.starfield && this.starfield.points ? this.starfield.points.visible : true;
    const prevBacklightVisible = this.backlightSprite ? this.backlightSprite.visible : true;

    try {
      this.renderer.setPixelRatio(1);
      this.renderer.setSize(width, height, false);
      this.camera.aspect = width / height;
      this.camera.updateProjectionMatrix();

      if (transparent) {
        this.scene.fog = null;
        this.renderer.setClearColor(0x000000, 0);
        if (this.backlightSprite) this.backlightSprite.visible = false;
      } else {
        this.renderer.setClearColor(prevClearColor, 1);
      }

      if (hideStars && this.starfield) {
        this.starfield.setVisible(false);
      }

      this.renderer.clear();
      this.renderer.render(this.scene, this.camera);

      if (transparent || !cinemaGrade) {
        return this.renderer.domElement.toDataURL('image/png');
      }

      const postCanvas = document.createElement('canvas');
      postCanvas.width = width;
      postCanvas.height = height;
      const ctx = postCanvas.getContext('2d');

      ctx.drawImage(this.renderer.domElement, 0, 0, width, height);

      try {
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        const blurPx = Math.max(8, Math.round(Math.min(width, height) * 0.014));
        ctx.filter = `blur(${blurPx}px) brightness(1.22)`;
        ctx.globalAlpha = 0.24;
        ctx.drawImage(this.renderer.domElement, 0, 0, width, height);
        ctx.restore();
      } catch (_) {

      }

      const vignetteStrength = this.store.getState().effects.vignetteStrength ?? 0.72;
      if (vignetteStrength > 0.01) {
        const cx = width * 0.5;
        const cy = height * 0.5;
        const outerR = Math.hypot(cx, cy);
        const innerR = outerR * 0.44;
        const vg = ctx.createRadialGradient(cx, cy, innerR, cx, cy, outerR);
        vg.addColorStop(0, 'rgba(0, 0, 0, 0)');
        vg.addColorStop(0.65, `rgba(0, 0, 0, ${(vignetteStrength * 0.42).toFixed(3)})`);
        vg.addColorStop(1, `rgba(0, 0, 0, ${(vignetteStrength * 0.88).toFixed(3)})`);
        ctx.fillStyle = vg;
        ctx.fillRect(0, 0, width, height);
      }

      if (watermark) {
        ctx.save();
        const fontSize = Math.max(12, Math.round(Math.min(width, height) * 0.012));
        ctx.font = `600 ${fontSize}px "JetBrains Mono", monospace`;
        ctx.fillStyle = 'rgba(230, 232, 236, 0.34)';
        ctx.textAlign = 'right';
        ctx.fillText('ERATIS STUDIO · @ERATIS-HQ', width - fontSize * 2.2, height - fontSize * 1.8);
        ctx.restore();
      }

      return postCanvas.toDataURL('image/png');
    } finally {
      this.scene.fog = prevFog;
      this.renderer.setClearColor(prevClearColor, prevClearAlpha);
      if (this.starfield) {
        this.starfield.setVisible(prevStarsVisible);
      }
      if (this.backlightSprite) {
        this.backlightSprite.visible = prevBacklightVisible;
      }
      this.renderer.setPixelRatio(prevPixelRatio);
      this.renderer.setSize(prevSize.x, prevSize.y, false);
      this.camera.aspect = prevAspect;
      this.camera.updateProjectionMatrix();
      this.renderer.render(this.scene, this.camera);
    }
  }

  dispose() {
    this._disposed = true;
    this._stopLoop();

    if (this._textDebounceTimer) {
      clearTimeout(this._textDebounceTimer);
      this._textDebounceTimer = null;
    }
    this._textReportListeners.clear();

    for (const cleanup of this._cleanups) {
      try {
        cleanup();
      } catch (_) {

      }
    }
    this._cleanups = [];

    const sharedMats = this.materialManager ? new Set(this.materialManager.materials.values()) : null;

    if (this.eratisGroup) {
      disposeObject3D(this.eratisGroup, { skipMaterials: sharedMats, disposeTextures: false });
    }
    if (this.swooshGroup) {
      disposeObject3D(this.swooshGroup, { skipMaterials: sharedMats, disposeTextures: false });
    }
    if (this.flareData) {
      if (this.flareData.upperFlare && this.flareData.upperFlare.material) {
        this.flareData.upperFlare.material.dispose();
      }
      if (this.flareData.lowerFlare && this.flareData.lowerFlare.material) {
        this.flareData.lowerFlare.material.dispose();
      }
      if (this.flareData.texture) {
        this.flareData.texture.dispose();
      }
    }
    if (this.textBuilder) {
      this.textBuilder.dispose(sharedMats);
    }
    if (this.imageLayer) {
      this.imageLayer.dispose();
    }
    if (this.starfield) {
      this.starfield.dispose();
    }
    if (this.backlightSprite && this.backlightSprite.material) {
      this.backlightSprite.material.dispose();
    }
    if (this.backlightTexture) {
      this.backlightTexture.dispose();
    }
    if (this.materialManager) {
      this.materialManager.dispose();
    }
    if (this.renderer) {
      this.renderer.dispose();
      if (this.renderer.domElement && this.renderer.domElement.parentNode) {
        this.renderer.domElement.parentNode.removeChild(this.renderer.domElement);
      }
    }
  }
}

class ExportStudio {
  constructor({ sceneEngine, presetManager, audioEngine, onNotify }) {
    this.sceneEngine = sceneEngine;
    this.presetManager = presetManager;
    this.audioEngine = audioEngine;
    this.onNotify = onNotify || (() => {});

    this.isOpen = false;
    this.isRecording = false;
    this.cinemaGrade = true;
    this.includeWatermark = false;

    this.mediaRecorder = null;
    this.recordedChunks = [];
    this.recordingStream = null;
    this.recordingStartedAt = 0;
    this.recordingTimer = null;

    this.el = null;
    this._buildModal();
  }

  static getVideoSupport() {
    const hasRecorder = typeof window !== 'undefined' && typeof window.MediaRecorder === 'function';
    const testCanvas = typeof document !== 'undefined' ? document.createElement('canvas') : null;
    const hasCapture = Boolean(testCanvas && typeof testCanvas.captureStream === 'function');

    if (!hasRecorder || !hasCapture) {
      return {
        supported: false,
        mimeType: '',
        reason: 'This browser does not support MediaRecorder or canvas.captureStream() for WebM video export.'
      };
    }

    const candidates = [
      'video/webm;codecs=vp9,opus',
      'video/webm;codecs=vp9',
      'video/webm;codecs=vp8,opus',
      'video/webm;codecs=vp8',
      'video/webm'
    ];
    for (const mime of candidates) {
      if (typeof MediaRecorder.isTypeSupported === 'function' && MediaRecorder.isTypeSupported(mime)) {
        return { supported: true, mimeType: mime, reason: '' };
      }
    }

    return {
      supported: false,
      mimeType: '',
      reason: 'No supported WebM video codec was reported by MediaRecorder in this browser.'
    };
  }

  _buildModal() {
    const videoSupport = ExportStudio.getVideoSupport();

    const backdrop = document.createElement('div');
    backdrop.id = 'export-modal';
    backdrop.className = 'modal-backdrop hidden';
    backdrop.setAttribute('role', 'dialog');
    backdrop.setAttribute('aria-modal', 'true');
    backdrop.setAttribute('aria-label', 'Wallpaper & Export Studio');

    backdrop.innerHTML = `
      <div class="export-card">
        <div class="export-header">
          <div>
            <div class="export-eyebrow">ERATIS WALLPAPER &amp; EXPORT STUDIO</div>
            <h2 class="export-title">Cinema Wallpapers &amp; 3D Captures</h2>

    this.el = backdrop;

    const chkBloom = backdrop.querySelector('#export-chk-bloom');
    const chkWater = backdrop.querySelector('#export-chk-watermark');
    if (chkBloom) {
      chkBloom.addEventListener('change', (e) => {
        this.cinemaGrade = e.target.checked;
      });
    }
    if (chkWater) {
      chkWater.addEventListener('change', (e) => {
        this.includeWatermark = e.target.checked;
      });
    }

    backdrop.addEventListener('click', (e) => {
      if (e.target === backdrop || e.target.closest('[data-export-close]')) {
        this.close();
        return;
      }
      const actionBtn = e.target.closest('[data-action]');
      if (actionBtn) {
        this._handleAction(actionBtn.getAttribute('data-action'));
      }
    });

    const recBtn = backdrop.querySelector('#btn-record-webm');
    if (recBtn) {
      recBtn.addEventListener('click', () => {
        if (this.isRecording) {
          this.stopRecording();
        } else {
          this.startRecording();
        }
      });
    }
  }

  open() {
    if (!this.el) return;
    this.isOpen = true;
    this.el.classList.remove('hidden');
  }

  close() {
    if (!this.el) return;
    this.isOpen = false;
    this.el.classList.add('hidden');
  }

  toggle() {
    if (this.isOpen) this.close();
    else this.open();
  }

  triggerExportAction(action) {
    this._handleAction(action);
  }

  _downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }

  _downloadDataUrl(dataUrl, filename) {
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  _handleAction(action) {
    const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
    try {
      if (action === 'png-transparent') {
        const dataUrl = this.sceneEngine.captureSnapshot({
          width: 2560,
          height: 1440,
          transparent: true,
          hideStars: true,
          cinemaGrade: false
        });
        this._downloadDataUrl(dataUrl, `eratis-transparent-${stamp}.png`);
        this.onNotify('Exported Transparent 3D Logo (2560×1440 Alpha PNG).', 'success');
      } else if (action === 'wallpaper-4k') {
        const dataUrl = this.sceneEngine.captureSnapshot({
          width: 3840,
          height: 2160,
          transparent: false,
          hideStars: false,
          cinemaGrade: this.cinemaGrade,
          watermark: this.includeWatermark
        });
        this._downloadDataUrl(dataUrl, `eratis-wallpaper-4k-${stamp}.png`);
        this.onNotify('Exported 4K UHD Cinema Wallpaper (3840×2160).', 'success');
      } else if (action === 'wallpaper-16-9') {
        const dataUrl = this.sceneEngine.captureSnapshot({
          width: 1920,
          height: 1080,
          transparent: false,
          hideStars: false,
          cinemaGrade: this.cinemaGrade,
          watermark: this.includeWatermark
        });
        this._downloadDataUrl(dataUrl, `eratis-wallpaper-16x9-${stamp}.png`);
        this.onNotify('Exported 16:9 HD Wallpaper (1920×1080).', 'success');
      } else if (action === 'wallpaper-21-9') {
        const dataUrl = this.sceneEngine.captureSnapshot({
          width: 3440,
          height: 1440,
          transparent: false,
          hideStars: false,
          cinemaGrade: this.cinemaGrade,
          watermark: this.includeWatermark
        });
        this._downloadDataUrl(dataUrl, `eratis-ultrawide-21x9-${stamp}.png`);
        this.onNotify('Exported 21:9 Ultrawide Wallpaper (3440×1440).', 'success');
      } else if (action === 'wallpaper-9-16') {
        const dataUrl = this.sceneEngine.captureSnapshot({
          width: 1080,
          height: 1920,
          transparent: false,
          hideStars: false,
          cinemaGrade: this.cinemaGrade,
          watermark: this.includeWatermark
        });
        this._downloadDataUrl(dataUrl, `eratis-mobile-9x16-${stamp}.png`);
        this.onNotify('Exported 9:16 Mobile Lockscreen Wallpaper (1080×1920).', 'success');
      } else if (action === 'profile-1-1') {
        const dataUrl = this.sceneEngine.captureSnapshot({
          width: 2048,
          height: 2048,
          transparent: false,
          hideStars: false,
          cinemaGrade: this.cinemaGrade,
          watermark: this.includeWatermark
        });
        this._downloadDataUrl(dataUrl, `eratis-profile-1x1-${stamp}.png`);
        this.onNotify('Exported 1:1 Square Profile Art (2048×2048).', 'success');
      } else if (action === 'scene-json') {
        const { json, payload } = this.presetManager.exportSceneJSON(`ERATIS Scene ${stamp}`);
        const blob = new Blob([json], { type: 'application/json' });
        this._downloadBlob(blob, `eratis-scene-${stamp}.json`);
        this.onNotify(
          payload.metadata.excludedTypes.length > 0
            ? 'Scene JSON exported (local media omitted for privacy).'
            : 'Scene JSON exported successfully.',
          'success'
        );
      }
    } catch (err) {
      this.onNotify(`Export failed: ${err.message}`, 'error');
    }
  }

  startRecording() {
    const support = ExportStudio.getVideoSupport();
    if (!support.supported) {
      this.onNotify(support.reason, 'warning');
      return;
    }

    const canvas = this.sceneEngine.getCanvas();
    if (!canvas) {
      this.onNotify('WebGL canvas is unavailable for recording.', 'error');
      return;
    }

    try {
      const canvasStream = canvas.captureStream(60);
      const tracks = [...canvasStream.getVideoTracks()];

      const audioStream = this.audioEngine ? this.audioEngine.getRecordingAudioStream() : null;
      if (audioStream) {
        const audioTracks = audioStream.getAudioTracks();
        if (audioTracks.length > 0) {
          tracks.push(audioTracks[0]);
        }
      }

      this.recordingStream = new MediaStream(tracks);
      this.recordedChunks = [];

      const options = {
        mimeType: support.mimeType,
        videoBitsPerSecond: 8000000
      };

      this.mediaRecorder = new MediaRecorder(this.recordingStream, options);
      this.mediaRecorder.ondataavailable = (ev) => {
        if (ev.data && ev.data.size > 0) {
          this.recordedChunks.push(ev.data);
        }
      };

      this.mediaRecorder.onstop = () => {
        const blob = new Blob(this.recordedChunks, { type: support.mimeType || 'video/webm' });
        const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
        this._downloadBlob(blob, `eratis-capture-${stamp}.webm`);
        this.recordedChunks = [];
        this._cleanupRecordingStream();
        this.onNotify('WebM video recording saved.', 'success');
      };

      this.mediaRecorder.onerror = () => {
        this.onNotify('Video recording encountered a MediaRecorder error.', 'error');
        this.stopRecording();
      };

      this.mediaRecorder.start(250);
      this.isRecording = true;
      this.recordingStartedAt = Date.now();
      this._updateRecordingUI();

      this.recordingTimer = setInterval(() => this._updateRecordingUI(), 250);
      this.onNotify('WebM recording started. Close modal to interact while recording.', 'info');
    } catch (err) {
      this._cleanupRecordingStream();
      this.onNotify(`Unable to start WebM recording: ${err.message}`, 'error');
    }
  }

  stopRecording() {
    if (!this.isRecording) return;
    this.isRecording = false;
    if (this.recordingTimer) {
      clearInterval(this.recordingTimer);
      this.recordingTimer = null;
    }
    if (this.mediaRecorder && this.mediaRecorder.state !== 'inactive') {
      try {
        this.mediaRecorder.stop();
      } catch (_) {
        this._cleanupRecordingStream();
      }
    } else {
      this._cleanupRecordingStream();
    }
    this._updateRecordingUI();
  }

  _cleanupRecordingStream() {
    if (this.recordingStream) {
      for (const track of this.recordingStream.getVideoTracks()) {
        track.stop();
      }
      this.recordingStream = null;
    }
    this.mediaRecorder = null;
  }

  _updateRecordingUI() {
    if (!this.el) return;
    const btn = this.el.querySelector('#btn-record-webm');
    const lbl = this.el.querySelector('#btn-record-label');
    const status = this.el.querySelector('#export-video-status');
    const dockRecIndicator = document.getElementById('dock-rec-badge');

    if (this.isRecording) {
      const elapsed = (Date.now() - this.recordingStartedAt) / 1000;
      if (btn) btn.classList.add('recording');
      if (lbl) lbl.textContent = `STOP (${formatTime(elapsed)})`;
      if (status) status.textContent = `Recording live WebM · ${formatTime(elapsed)}`;
      if (dockRecIndicator) dockRecIndicator.classList.remove('hidden');
    } else {
      const support = ExportStudio.getVideoSupport();
      if (btn) btn.classList.remove('recording');
      if (lbl) lbl.textContent = 'START REC';
      if (status) {
        status.textContent = support.supported ? `Ready · Codec: ${support.mimeType}` : support.reason;
      }
      if (dockRecIndicator) dockRecIndicator.classList.add('hidden');
    }
  }

  dispose() {
    if (this.isRecording) {
      this.stopRecording();
    }
    if (this.el && this.el.parentNode) {
      this.el.parentNode.removeChild(this.el);
    }
    this.el = null;
  }
}

function sanitizeSvgMarkup(rawSvg) {
  if (typeof rawSvg !== 'string' || !rawSvg.trim()) {
    throw new Error('SVG content is empty.');
  }
  const cleaned = rawSvg
    .replace(/<\?xml[\s\S]*?\?>/gi, '')
    .replace(/<!DOCTYPE[\s\S]*?>/gi, '')
    .replace(/<script[\s\S]*?<\/script>/gi, '')
    .replace(/<iframe[\s\S]*?<\/iframe>/gi, '')
    .replace(/<object[\s\S]*?<\/object>/gi, '')
    .replace(/<embed[\s\S]*?>/gi, '')
    .replace(/<foreignObject[\s\S]*?<\/foreignObject>/gi, '')
    .replace(/\son[a-z]+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi, '')
    .replace(/javascript\s*:/gi, '');

  const svgMatch = cleaned.match(/<svg[\s\S]*<\/svg>/i);
  if (!svgMatch) {
    throw new Error('File does not contain a valid <svg> root element.');
  }
  return svgMatch[0];
}

function easeCalligraphicStroke(t) {
  const u = Math.max(0, Math.min(1, t));
  return u < 0.5 ? 2.2 * u * u : 1 - Math.pow(-2 * u + 2, 2.15) / 2;
}

class SignatureIntro {
  constructor({ onReveal, onNotify }) {
    this.onReveal = onReveal || (() => {});
    this.onNotify = onNotify || (() => {});

    this.overlay = null;
    this.svgHost = null;
    this.sweepEl = null;

    this.defaultSvgMarkup = null;
    this.customSvgMarkup = null;
    this.customSvgName = '';

    this.isActive = false;
    this._rafId = null;
    this._timers = [];
    this._buildOverlay();
  }

  _buildOverlay() {
    const overlay = document.createElement('div');
    overlay.id = 'signature-intro';
    overlay.className = 'signature-intro hidden';
    overlay.innerHTML = `
      <div class="signature-stage">
        <div class="signature-svg-host" id="signature-svg-host"></div>
        <div class="signature-caption">
          <span class="signature-caption-line"></span>
          <span>ERATIS — INTERACTIVE 3D IDENTITY STUDIO</span>
          <span class="signature-caption-line"></span>
        </div>
      </div>
      <div class="signature-light-sweep" id="signature-light-sweep"></div>
      <button type="button" class="skip-intro-btn" id="btn-skip-intro" title="Skip Intro (Esc)">

          <path class="skip-chev-1" d="M 3.8 4.8 L 8.2 9 L 3.8 13.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />

        </svg>
        <span class="skip-intro-label">SKIP INTRO</span>
        <kbd class="skip-intro-kbd">ESC</kbd>
      </button>
    `;

    document.body.appendChild(overlay);
    this.overlay = overlay;
    this.svgHost = overlay.querySelector('#signature-svg-host');
    this.sweepEl = overlay.querySelector('#signature-light-sweep');

    const skipBtn = overlay.querySelector('#btn-skip-intro');
    if (skipBtn) {
      skipBtn.addEventListener('click', () => this.skip());
    }
  }

  async _getActiveSvgMarkup() {
    if (this.customSvgMarkup) {
      return this.customSvgMarkup;
    }
    if (this.defaultSvgMarkup) {
      return this.defaultSvgMarkup;
    }
    if (typeof window !== 'undefined' && window.__ERATIS_DEFAULT_SIGNATURE_SVG__) {
      this.defaultSvgMarkup = window.__ERATIS_DEFAULT_SIGNATURE_SVG__;
      return this.defaultSvgMarkup;
    }

    try {
      const response = await fetch(APP_INFO.signatureAssetPath, { cache: 'no-cache' });
      if (response.ok) {
        const text = await response.text();
        this.defaultSvgMarkup = sanitizeSvgMarkup(text);
        return this.defaultSvgMarkup;
      }
    } catch (_) {

    }

    this.defaultSvgMarkup = FALLBACK_ERATIS_SVG;
    return this.defaultSvgMarkup;
  }

  _clearTimers() {
    if (this._rafId !== null) {
      cancelAnimationFrame(this._rafId);
      this._rafId = null;
    }
    for (const id of this._timers) {
      clearTimeout(id);
    }
    this._timers = [];
  }

  _schedule(fn, ms) {
    const id = setTimeout(fn, ms);
    this._timers.push(id);
    return id;
  }

  async play() {
    this._clearTimers();
    this.isActive = true;

    const markup = await this._getActiveSvgMarkup();
    this.svgHost.innerHTML = markup;
    this.svgHost.classList.remove('gleaming');

    const svgEl = this.svgHost.querySelector('svg');
    if (!svgEl) {
      this.skip();
      return;
    }

    svgEl.classList.add('signature-svg');
    svgEl.removeAttribute('width');
    svgEl.removeAttribute('height');

    const dedicatedStrokes = Array.from(svgEl.querySelectorAll('[data-signature-stroke]'));
    const isCustomFallback = dedicatedStrokes.length === 0;
    const drawables = isCustomFallback
      ? Array.from(svgEl.querySelectorAll('path, line, polyline, polygon, circle, ellipse, rect'))
      : dedicatedStrokes;

    if (drawables.length === 0) {
      this.skip();
      return;
    }

    const penTip = svgEl.querySelector('#sig-pen-tip');
    const starFlare = svgEl.querySelector('#sig-star-flare');
    if (starFlare) {
      starFlare.classList.remove('ignited');
      starFlare.style.opacity = '0';
    }

    this.overlay.classList.remove('hidden', 'fading-out');
    this.sweepEl.classList.remove('sweeping');

    const scheduleSegments = [];
    let timelineCursor = 110;

    for (const el of drawables) {
      let length = 0;
      try {
        if (typeof el.getTotalLength === 'function') {
          length = el.getTotalLength();
        }
      } catch (_) {
        length = 320;
      }
      if (!Number.isFinite(length) || length <= 0) {
        length = 240;
      }

      if (isCustomFallback) {
        const computedStroke = el.getAttribute('stroke');
        if (!computedStroke || computedStroke === 'none') {
          el.setAttribute('stroke', '#FFFFFF');
        }
        if (!el.getAttribute('stroke-width')) {
          el.setAttribute('stroke-width', '2.8');
        }
        el.setAttribute('fill', 'none');
        el.setAttribute('stroke-linecap', 'round');
        el.setAttribute('stroke-linejoin', 'round');
      }

      el.style.strokeDasharray = `${length} ${length}`;
      el.style.strokeDashoffset = `${length}`;
      el.style.transition = 'none';

      const attrDuration = Number(el.getAttribute('data-duration'));
      const attrPause = Number(el.getAttribute('data-pause'));
      const flareTrigger = el.hasAttribute('data-flare-trigger')
        ? Number(el.getAttribute('data-flare-trigger'))
        : null;

      const duration = Number.isFinite(attrDuration) && attrDuration > 0
        ? attrDuration
        : Math.max(140, Math.min(780, Math.round(length * 0.72)));
      const pauseAfter = Number.isFinite(attrPause) && attrPause >= 0 ? attrPause : 35;

      scheduleSegments.push({
        el,
        length,
        startAt: timelineCursor,
        endAt: timelineCursor + duration,
        duration,
        flareTrigger,
        flareFired: false
      });

      timelineCursor += duration + pauseAfter;
    }

    const totalWriteDuration = timelineCursor;
    const startedAt = performance.now();

    const stepFrame = (now) => {
      if (!this.isActive) return;
      const elapsed = now - startedAt;

      let activeSeg = null;

      for (const seg of scheduleSegments) {
        if (elapsed <= seg.startAt) {
          seg.el.style.strokeDashoffset = `${seg.length}`;
        } else if (elapsed >= seg.endAt) {
          seg.el.style.strokeDashoffset = '0';
          if (seg.flareTrigger !== null && !seg.flareFired) {
            seg.flareFired = true;
            this._igniteStarFlare(starFlare);
          }
        } else {
          activeSeg = seg;
          const rawProgress = (elapsed - seg.startAt) / seg.duration;
          const eased = easeCalligraphicStroke(rawProgress);
          seg.el.style.strokeDashoffset = `${seg.length * (1 - eased)}`;

          if (seg.flareTrigger !== null && !seg.flareFired && eased >= seg.flareTrigger) {
            seg.flareFired = true;
            this._igniteStarFlare(starFlare);
          }

          if (penTip && typeof seg.el.getPointAtLength === 'function') {
            try {
              const pt = seg.el.getPointAtLength(seg.length * eased);
              penTip.setAttribute('transform', `translate(${pt.x.toFixed(1)}, ${pt.y.toFixed(1)})`);
              penTip.style.opacity = '1';
            } catch (_) {}
          }
        }
      }

      if (!activeSeg && penTip) {
        penTip.style.opacity = '0';
      }

      if (elapsed < totalWriteDuration) {
        this._rafId = requestAnimationFrame(stepFrame);
      } else {
        this._rafId = null;
        if (penTip) penTip.style.opacity = '0';
        this.svgHost.classList.add('gleaming');

        this._schedule(() => {
          if (!this.isActive) return;
          this.sweepEl.classList.add('sweeping');
          this.onReveal(false);
        }, 520);

        this._schedule(() => {
          if (!this.isActive) return;
          this.overlay.classList.add('fading-out');
        }, 860);

        this._schedule(() => {
          this._finish();
        }, 1560);
      }
    };

    this._rafId = requestAnimationFrame(stepFrame);
  }

  _igniteStarFlare(starFlare) {
    if (!starFlare) return;
    starFlare.style.opacity = '1';
    starFlare.classList.add('ignited');
  }

  skip() {
    if (!this.isActive) return;
    this._clearTimers();
    this.onReveal(true);
    this._finish();
  }

  _finish() {
    this._clearTimers();
    this.isActive = false;
    if (this.overlay) {
      this.overlay.classList.add('hidden');
      this.overlay.classList.remove('fading-out');
    }
    if (this.sweepEl) {
      this.sweepEl.classList.remove('sweeping');
    }
  }

  async loadCustomSvgFile(file) {
    if (!file) return false;
    const isSvg = file.type === 'image/svg+xml' || /\.svg$/i.test(file.name || '');
    if (!isSvg) {
      throw new Error('Please choose a valid .svg signature file.');
    }

    const rawText = await file.text();
    const cleanMarkup = sanitizeSvgMarkup(rawText);
    this.customSvgMarkup = cleanMarkup;
    this.customSvgName = file.name || 'Custom Signature.svg';
    this.onNotify(`Custom signature loaded: ${this.customSvgName}`, 'success');
    await this.play();
    return true;
  }

  resetDefaultSignature() {
    this.customSvgMarkup = null;
    this.customSvgName = '';
    this.onNotify('Restored default ERATIS calligraphic signature.', 'info');
  }

  getCustomSvgName() {
    return this.customSvgName;
  }

  dispose() {
    this._clearTimers();
    if (this.overlay && this.overlay.parentNode) {
      this.overlay.parentNode.removeChild(this.overlay);
    }
    this.overlay = null;
  }
}

  _bind() {

      this.store.updateSection('camera', {
        autoOrbit: nextOrbit,
        staticLock: nextOrbit ? false : cam.staticLock
      });
    });

    q('#dock-btn-lock').addEventListener('click', () => {
      const cam = this.store.getState().camera;
      const nextLock = !cam.staticLock;
      this.store.updateSection('camera', {
        staticLock: nextLock,
        autoOrbit: nextLock ? false : cam.autoOrbit
      });
    });

    q('#dock-btn-warp').addEventListener('click', () => {
      const current = this.store.getState().effects.warpActive;
      this.store.updateSection('effects', { warpActive: !current });
    });

    q('#dock-btn-audio').addEventListener('click', () => {
      if (this.audioEngine.getPlaylist().length === 0) {
        this.onTriggerAudioLoad();
      } else {
        this.audioEngine.togglePlay();
      }
    });

    q('#dock-btn-mat').addEventListener('click', () => {
      const ids = Object.keys(MATERIAL_CATALOG);
      const cur = this.store.getState().identity.material;
      const next = ids[(ids.indexOf(cur) + 1) % ids.length];
      this.store.updateSection('identity', { material: next });
      const label = MATERIAL_CATALOG[next] ? MATERIAL_CATALOG[next].label : next;
      this.onNotify(`Material: ${label}`, 'info');
    });

    q('#dock-btn-reset-eratis').addEventListener('click', () => {
      this.store.resetIdentityToEratis();
    });

    q('#dock-btn-export').addEventListener('click', () => {
      this._closeMobileMenu();
      this._hidePopoverImmediate();
      this.onToggleExport();
    });

    q('#dock-btn-reset-all').addEventListener('click', () => {
      this._closeMobileMenu();
      this._triggerFullFactoryReset();
